I は Google ネイティブです。\",\"apiStyle\":{\"anthropic\":\"Anthropic 互換\",\"openai\":\"OpenAI 互換\",\"gemini\":\"Gemini / Google\"},\"tie\":{\"body\":\"まず安いモデルやプロバイダーを選び、そのキーとエンドポイントを上の手順に入れてください。\",\"pricingLink\":\"価格を比較\",\"providersLink\":\"プロバイダーを見る\"},\"seo\":{\"detailTitle\":\"{name} を任意の API キーで設定する方法 | LLM Pricing\"},\"guides\":{\"claude-code\":{\"name\":\"Claude Code\",\"tagline\":\"Anthropic 公式のターミナルエージェント。\",\"intro\":\"Claude Code は Anthropic Messages プロトコルを使います。Anthropic のキーをそのまま使うか、2 つの環境変数で任意の Anthropic 互換エンドポイントに向けられます。\",\"tip\":\"api.anthropic.com 以外のベース URL は第三者ゲートウェイとして扱われます。bearer トークンを求めるゲートウェイには ANTHROPIC_AUTH_TOKEN を使ってください。\",\"steps\":{\"install\":{\"title\":\"CLI をインストール\",\"desc\":\"Node.js 18 以降が必要です。グローバルコマンド claude が入ります。\"},\"official-key\":{\"title\":\"方法 A：Anthropic のキーを使う\",\"desc\":\"Anthropic コンソールのキーを設定します。Windows はセッションをまたいで保持します。setx の後はターミナルを開き直してください。\"},\"custom-endpoint\":{\"title\":\"方法 B：カスタムエンドポイントを使う\",\"desc\":\"すべてのリクエストをより安い Anthropic 互換ゲートウェイに転送します。URL とキーをプロバイダーの値に置き換えてください。\"},\"config-file\":{\"title\":\"永続化する\",\"desc\":\"毎回 export する代わりに、エンドポイントとキーを設定ファイルに保存すれば、どのセッションでも読み込まれます。\"},\"run\":{\"title\":\"使い始める\",\"desc\":\"プロジェクトのフォルダーで実行します。今いる場所でファイルを読み書きします。\"}}},\"codex-cli\":{\"name\":\"Codex CLI\",\"tagline\":\"OpenAI 公式のターミナルエージェント。\",\"intro\":\"Codex は OpenAI 互換 API を使うため、api.openai.com 以外とも通信できます。OpenAI のキーをそのまま使うか、設定ファイルでカスタムプロバイダーを宣言します。\",\"tip\":\"ChatGPT でログインしていた場合は、まず codex logout を実行し、次回起動時に「Provide your own API key」を選ぶと、あなたのカスタムプロバイダーが使われます。\",\"steps\":{\"install\":{\"title\":\"CLI をインストール\",\"desc\":\"Node.js 18 以降が必要です。グローバルコマンド codex が入ります。\"},\"official-key\":{\"title\":\"方法 A：OpenAI のキーを使う\",\"desc\":\"OpenAI プラットフォームのキーを設定します。Windows では setx の後にターミナルを開き直してください。\"},\"custom-provider\":{\"title\":\"方法 B：カスタムプロバイダーを追加\",\"desc\":\"設定ファイルに OpenAI 互換エンドポイントを宣言します。env_key はキーを格納する環境変数名で、wire_api = chat は多くの第三者エンドポイントに適しています。\"},\"logout\":{\"title\":\"保存された ChatGPT ログインを消す\",\"desc\":\"以前 ChatGPT でログインした場合のみ。これで Codex は自分のキーを使うようになります。\"},\"run\":{\"title\":\"使い始める\",\"desc\":\"プロジェクトのフォルダーで実行し、指示を出し始めてください。\"}}},\"gemini-cli\":{\"name\":\"Gemini CLI\",\"tagline\":\"Google 公式のターミナルエージェント。\",\"intro\":\"最短は Google AI Studio の API キーを GEMINI_API_KEY に設定する方法です。起動して Google アカウントでログインし、無料枠を使うこともできます。\",\"tip\":\"試すだけならキー不要です。gemini を実行して Google アカウントでログインしてください。上限を上げたり API 課金にするには GEMINI_API_KEY を使います。\",\"steps\":{\"install\":{\"title\":\"CLI をインストール\",\"desc\":\"Node.js 20 以降が必要です。グローバルコマンド gemini が入ります。\"},\"get-key\":{\"title\":\"API キーを取得\",\"desc\":\"Google AI Studio で無料のキーを作成してコピーします。\"},\"set-env\":{\"title\":\"キーを設定\",\"desc\":\"GEMINI_API_KEY 環境変数に保存します。セッションをまたいで保持するにはシェルのプロファイルに追加してください。\"},\"run\":{\"title\":\"使い始める\",\"desc\":\"プロジェクトのフォルダーで実行して、チャットやコードの読み書きを行います。\"}}},\"aider\":{\"name\":\"Aider\",\"tagline\":\"ターミナルで動くオープンソースの AI ペアプログラミング。\",\"intro\":\"Aider はほぼどんなモデルでも使えます。OpenAI や Anthropic のキーをそのまま使うか、OpenAI 互換のベース URL を設定してより安いプロバイダー経由にできます。\",\"tip\":\"OpenAI 互換エンドポイントでは、モデル名の前に openai/ を付けて Aider に OpenAI 形式として扱わせます。例：--model openai/your-model-name。\",\"steps\":{\"install\":{\"title\":\"Aider をインストール\",\"desc\":\"Python 3.8 以降が必要です。pip 経由で aider コマンドが入ります。\"},\"official-key\":{\"title\":\"方法 A：プロバイダーのキーを使う\",\"desc\":\"モデルのプロバイダーのキーを設定し、--model でモデルを選びます。\"},\"custom-endpoint\":{\"title\":\"方法 B：カスタムエンドポイントを使う\",\"desc\":\"OPENAI_API_BASE をプロバイダーの URL に設定し、モデル名の前に openai/ を付けます。\"},\"config-file\":{\"title\":\"永続化する\",\"desc\":\"エンドポイント、キー、モデルをプロジェクトの .env ファイルに保存すれば、毎回入力せずに済みます。\"}}},\"opencode\":{\"name\":\"opencode\",\"tagline\":\"どのプロバイダーでも使えるオープンソースのターミナルエージェント。\",\"intro\":\"opencode は OPENAI_BASE_URL を読まず、各プロバイダーをベース URL で設定します。最速は対話式ログインで、細かく制御するには設定ファイルを編集します。\",\"tip\":\"opencode はカスタムエンドポイント用に OPENAI_BASE_URL や OPENAI_API_KEY を読みません。auth login か設定ファイルでプロバイダーを宣言する必要があります。\",\"steps\":{\"install\":{\"title\":\"opencode をインストール\",\"desc\":\"Node.js 18 以降が必要です。グローバルコマンド opencode が入ります。\"},\"quick-auth\":{\"title\":\"方法 A：クイックログイン\",\ 量を入力し、モデルをいくつか選ぶと、公式チャネルと最安の有料チャネルでの月額が分かります。キャッシュ読み取りのヒット率は一級の入力項目です — エージェント用途では請求の大半を占めることが多いです。\",\"inputTokens\":\"入力トークン / 月\",\"outputTokens\":\"出力トークン / 月\",\"cacheHit\":\"キャッシュヒット率 {n}%\",\"scenarios\":\"シナリオプリセット\",\"preset\":{\"light\":{\"name\":\"軽いお試し\",\"assume\":\"入力200万 / 出力50万 · キャッシュ0%\"},\"agent\":{\"name\":\"エージェントコーディング\",\"assume\":\"入力2億 / 出力5000万 · キャッシュ60%\"},\"batch\":{\"name\":\"大規模バッチ\",\"assume\":\"入力10億 / 出力1億 · キャッシュ80%\"}},\"pickModels\":\"モデル\",\"empty\":\"上でモデルを検索・追加すると月額を試算できます。\",\"th\":{\"model\":\"モデル\",\"official\":\"公式 / 定価\",\"cheapest\":\"最安チャネル\"},\"note\":\"月額 = 入力×(1−ヒット率)×単価 + 入力×ヒット率×キャッシュ読み取り + 出力×単価。キャッシュ読み取り価格のないチャネルは入力価格にフォールバックします。$0 チャネルは除外（無料枠は通常レート制限があり SLA なし）。ゲートウェイのチャネルには隠れた制限がある場合があります — 可用性はご自身で確認してください。\"},\"tokenTool\":{\"title\":\"トークン計算 · トークナイザー横断\",\"subtitle\":\"テキストを貼り付けると、各トークナイザーで何トークンになり、いくらかかるかが分かります。クライアント側で正確に数えられるのは OpenAI 系のみで、その他は推定と表示されます。中国語などの CJK テキストはトークナイザーによって大きく異なります。\",\"placeholder\":\"ここにテキストを貼り付け・入力…\",\"charCount\":\"{n} 文字\",\"cjkRatio\":\"CJK {pct}%\",\"loadSample\":\"日英サンプルを読み込む\",\"clear\":\"クリア\",\"compareTitle\":\"トークナイザー別のトークン数\",\"exact\":\"正確\",\"estimate\":\"推定 ±{pct}%\",\"estShort\":\"推定\",\"compareNote\":\"正確な値は gpt-tokenizer（o200k_base / cl100k_base）を使用。推定は正確な o200k 値を基準に CJK 比率でスケールしたもので、あくまで目安であり精密値ではありません。Claude と Gemini には公開のクライアント側トークナイザーがありません。\",\"costTitle\":\"このテキストのモデル別コスト\",\"costNote\":\"コスト = トークン数 ÷ 100万 × モデルの定価。「入力として」は入力価格、「出力として」は出力価格を使います。OpenAI 以外のモデルのトークン数は推定です。\",\"families\":{\"gpt4o\":\"GPT-4o / GPT-5（o200k）\",\"gpt4\":\"GPT-4 / GPT-3.5（cl100k）\",\"claude\":\"Claude\",\"gemini\":\"Gemini\",\"llama\":\"Llama 3\"},\"th\":{\"tokenizer\":\"トークナイザー\",\"tokens\":\"トークン数\",\"cpt\":\"文字 / トークン\",\"accuracy\":\"精度\",\"model\":\"モデル\",\"asInput\":\"入力として\",\"asOutput\":\"出力として\"},\"sampleText\":\"The quick brown fox jumps over the lazy dog. 敏捷的棕色狐狸跳过了那只懒狗。人工智能正在改变我们编写和部署软件的方式。\"},\"subTool\":{\"title\":\"サブスク vs API\",\"subtitle\":\"あなたの利用量で、AI サブスクが従量課金 API より得かどうか。ここで最も信頼性の低いツールです — サブスクはトークンではなく期間で課金されるため、公式の損益分岐点はありません。単一の数値ではなく、範囲・感度・確認日を示します。\",\"disclaimer\":\"サブスクの価格と枠は手動でメンテしており、各プロバイダーに一つずつ確認したものではありません。枠は頻繁に変わります — すべてをおおまかな目安として扱い、公式ページで確認してください。トークン換算の容量は、各プランのウィンドウ枠に対する楽観的／保守的な読みです。\",\"convPerDay\":\"1日の会話数\",\"avgIn\":\"1会話あたりの平均入力トークン\",\"avgOut\":\"1会話あたりの平均出力トークン\",\"cacheHit\":\"キャッシュヒット率 {n}%\",\"scenarios\":\"シナリオプリセット\",\"preset\":{\"chat\":{\"name\":\"軽いチャット\",\"assume\":\"30/日 · 入力3K / 出力0.7K · キャッシュ20%\"},\"agent\":{\"name\":\"エージェントコーディング\",\"assume\":\"60/日 · 入力15K / 出力3K · キャッシュ70%\"},\"heavy\":{\"name\":\"ヘビーユーザー\",\"assume\":\"150/日 · 入力25K / 出力5K · キャッシュ80%\"}},\"monthlyTokens\":\"この利用量で月 約 {n}M トークン。\",\"coverage\":{\"within\":\"枠内\",\"near\":\"上限に近い\",\"over\":\"枠超過\"},\"perMonth\":\"/月\",\"apiEquiv\":\"API 従量課金（{model}）：\",\"verdictSaves\":\"サブスクで {lo}–{hi}/月 お得\",\"verdictPricier\":\"サブスクは {lo}–{hi}/月 割高\",\"verdictEven\":\"API とほぼ同等\",\"overQuotaWarn\":\" · ただし利用量がこのプランの枠を超える可能性が高いです\",\"breakEven\":\"損益分岐点 ≈ 1日 {range} 会話\",\"sensitivity\":\"キャッシュ50%時 ≈ {n}/日\",\"checkedAt\":\"{date} 確認\",\"rangeNote\":\"範囲はキャッシュヒットの不確実性（±15pp）と各プランの枠の楽観的／保守的な読みから来ます。損益分岐点が点ではなく領域なのは、サブスクの枠が固定トークン数に還元できない期間のウィンドウだからです。\"},\"subsCatalog\":{\"title\":\"AI サブスク価格\",\"subtitle\":\"ChatGPT、Claude、Gemini などの消費者向け AI サブスクのプランと枠の比較 — ユーザー/月で課金され、トークン単位の API とは別の軸です。各プロバイダー内で価格順に並べています。\",\"disclaimer\":\"価格と上限は {date} に収集した公開情報で、各プロバイダーに一つずつ確認したものではありません。プランは頻繁に変わるため、公式ページで確認してください。サブスクと従量課金 API を比較するには、\",\"calcLink\":\"サブスク vs API 計算機 →\",\"category\":\"種類\",\"catAll\":\"すべて\",\"catAssistant\":\"アシスタント\",\"catCoding\":\"コーディング\",\"audience\":\"対象\",\"audAll\":\"すべて\",\"audIndividual\":\"個人\",\"audTeam\":\"チーム\",\"free\":\"無料\",\"perSeat\":\"/席/月\",\"perMonth\":\"/月\",\"annual\":\"年払い {price}/月\",\"official\":\"公式 ↗\",\"footnote\":\"ほとんどのプロバイダーには、ここに載せていないエンタープライズ版やカスタム価格の階層があります。消費者向けサブスクはアプリ/エディター体験を含み、期間で課金されるため、トークン単価には還元できません。\"},\"apiDocs\":{\"title\":\"API · MCP\",\"intro\":\"本サイトの背後にある正規化され
