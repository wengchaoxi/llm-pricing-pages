oinciden.\"},\"cost\":{\"name\":\"Calculadora de coste\",\"desc\":\"Introduzca el uso mensual y una tasa de aciertos de caché para ordenar el coste mensual por canal.\"},\"token\":{\"name\":\"Contador de tokens · entre tokenizadores\",\"desc\":\"Recuento de tokens y coste de un mismo texto bajo varios tokenizadores.\"},\"subscription\":{\"name\":\"Suscripción vs API\",\"desc\":\"Compare una suscripción con la API de pago por uso según su nivel de uso.\"},\"subscriptions\":{\"name\":\"Precios de suscripciones IA\",\"desc\":\"Precios y cupos de los planes de ChatGPT, Claude, Gemini y otras suscripciones de consumo.\"},\"api\":{\"name\":\"API · MCP\",\"desc\":\"Datos de precios y clasificaciones mediante una API REST y un servidor MCP, para consulta por agentes.\"}}},\"notFound\":{\"code\":\"404\",\"title\":\"Página no encontrada\",\"body\":\"Esta dirección no corresponde a ninguna página del sitio. Puede contener un error de escritura o la página puede haberse movido.\",\"requested\":\"Dirección solicitada\",\"home\":\"Volver al inicio\",\"search\":\"Buscar modelos y proveedores\",\"searchFor\":\"Buscar «{q}»\"},\"placeholder\":{\"statusStub\":\"Esqueleto\",\"statusPlanned\":\"Planeado\",\"designSee\":\"Diseño en\"},\"tutorials\":{\"title\":\"Guías de configuración CLI\",\"subtitle\":\"Conecta las herramientas de programación con IA de línea de comandos a cualquier API en unos pasos. Copia, pega y sustituye los marcadores por tu propia clave y endpoint. Listo.\",\"official\":\"Oficial\",\"community\":\"Código abierto\",\"viewGuide\":\"Ver guía\",\"backToList\":\"Todas las guías\",\"stepsTitle\":\"Pasos de configuración\",\"officialDocs\":\"Documentación oficial\",\"copy\":\"Copiar\",\"copied\":\"Copiado\",\"tip\":{\"label\":\"Consejo:\"},\"basics\":{\"title\":\"Las 3 cosas que necesita cada herramienta\",\"apiKey\":{\"term\":\"Clave API\",\"desc\":\"Un token secreto que demuestra quién eres y contra el que se factura. Mantenlo privado y nunca lo subas a git.\"},\"base una pasarela compatible con Anthropic más barata. Sustituye la URL y la clave por los valores de tu proveedor.\"},\"config-file\":{\"title\":\"Hazlo permanente\",\"desc\":\"En lugar de exportar cada vez, guarda el endpoint y la clave en el archivo de ajustes para que cada sesión los tome.\"},\"run\":{\"title\":\"Empieza a programar\",\"desc\":\"Ejecútalo dentro de la carpeta de tu proyecto. Lee y edita archivos justo donde estás.\"}}},\"codex-cli\":{\"name\":\"Codex CLI\",\"tagline\":\"El agente de terminal oficial de OpenAI.\",\"intro\":\"Codex usa la API compatible con OpenAI, así que puede hablar con más que api.openai.com. Usa tu clave de OpenAI directamente o declara un proveedor propio en el archivo de configuración.\",\"tip\":\"Si iniciaste sesión con ChatGPT, ejecuta primero codex logout y luego elige «Provide your own API key» en el siguiente arranque para que use tu proveedor propio.\",\"steps\":{\"install\":{\"title\":\"Instala la CLI\",\"desc\":\"Requiere Node.js 18 o posterior. Instala el comando global codex.\"},\"official-key\":{\"title\":\"Opción A: usa tu clave de OpenAI\",\"desc\":\"Configura tu clave desde la plataforma de OpenAI. Reabre la terminal tras setx en Windows.\"},\"custom-provider\":{\"title\":\"Opción B: añade un proveedor propio\",\"desc\":\"Declara un endpoint compatible con OpenAI en el archivo de configuración. env_key indica la variable de entorno con la clave; wire_api = chat va bien para la mayoría de endpoints de terceros.\"},\"logout\":{\"title\":\"Borra un inicio de sesión de ChatGPT guardado\",\"desc\":\"Solo si antes iniciaste sesión con ChatGPT. Esto obliga a Codex a usar tu propia clave.\"},\"run\":{\"title\":\"Empieza a programar\",\"desc\":\"Ejecútalo dentro de la carpeta de tu proyecto y empieza a dar instrucciones.\"}}},\"gemini-cli\":{\"name\":\"Gemini CLI\",\"tagline\":\"El agente de terminal oficial de Google.\",\"intro\":\"La vía más rápida es una clave API de Google AI Studio en GEMINI_API_KEY. También puedes lanzarlo e iniciar sesión con tu cuenta de Google para el nivel gratuito.\",\"tip\":\"No necesitas clave para probarlo: ejecuta gemini e inicia sesión con una cuenta de Google. Para límites más altos y facturación por API, usa una GEMINI_API_KEY.\",\"steps\":{\"install\":{\"title\":\"Instala la CLI\",\"desc\":\"Requiere Node.js 20 o posterior. Instala el comando global gemini.\"},\"get-key\":{\"title\":\"Consigue una clave API\",\"desc\":\"Crea una clave gratuita en Google AI Studio y cópiala.\"},\"set-env\":{\"title\":\"Configura la clave\",\"desc\":\"Guárdala en la variable de entorno GEMINI_API_KEY. Añádela al perfil de tu shell para conservarla entre sesiones.\"},\"run\":{\"title\":\"Empieza a programar\",\"desc\":\"Ejecútalo dentro de la carpeta de tu proyecto para chatear, leer y editar código.\"}}},\"aider\":{\"name\":\"Aider\",\"tagline\":\"Programación en pareja con IA de código abierto en tu terminal.\",\"intro\":\"Aider funciona con casi cualquier modelo. Usa claves de OpenAI o Anthropic directamente, o define una URL base compatible con OpenAI para enrutar por un proveedor más barato.\",\"tip\":\"Para endpoints compatibles con OpenAI, antepón openai/ al modelo para que Aider lo trate como estilo OpenAI, p. ej. --model openai/your-model-name.\",\"steps\":{\"install\":{\"title\":\"Instala Aider\",\"desc\":\"Requiere Python 3.8 o posterior. Instala el comando aider vía pip.\"},\"official-key\":{\"title\":\"Opción A: usa una clave de proveedor\",\"desc\":\"Configura la clave del proveedor de tu modelo y luego elige un modelo con --model.\"},\"custom-endpoint\":{\"title\":\"Opción B: usa un endpoint propio\",\"desc\":\"Pon OPENAI_API_BASE con la URL de tu proveedor y antepón openai/ al nombre del modelo.\"},\"config-file\":{\"title\":\"Hazlo permanente\",\"desc\":\"Guarda el endpoint, la clave y el modelo en un archivo .env de tu proyecto para no reescribirlos.\"}}},\"opencode\":{\"name\":\"opencode\",\"tagline\":\"Agente de terminal de código abierto, funciona con cualquier proveedor.\",\"intro\":\"opencode configura cada proveedor con una URL base en lugar de leer OPENAI_BASE_URL. Lo más rápido es el inicio de sesión interactivo; para control total, edita el archivo de configuración.\",\"tip\":\"opencode no lee OPENAI_BASE_URL ni OPENAI_API_KEY para endpoints propios. Debes declarar el proveedor, ya sea con auth login o en el archivo de configuración.\",\"steps\":{\"install\":{\"title\":\"Instala opencode\",\"desc\":\"Requiere Node.js 18 o posterior. Instala el comando global opencode.\"},\"quick-auth\":{\"title\":\"Opción A: inicio rápido\",\"desc\":\"Ejecuta el comando de inicio de sesión, baja hasta «Other» y pega tu URL base y tu clave API.\"},\"config-file\":{\"title\":\"Opción B: archivo de configuración\",\"desc\":\"Declara un proveedor compatible con OpenAI con su URL base, clave y modelo. Sustituye los valores por los tuyos.\"},\"run\":{\"title\":\"Empieza a programar\",\"desc\":\"Lánzalo en la carpeta de tu proyecto y selecciona tu modelo propio con el comando /models.\"}}},\"qwen-code\":{\"name\":\"Qwen Code\",\"tagline\":\"Agente de código abierto optimizado para Qwen, compatible con OpenAI.\",\"intro\":\"Qwen Code lee tres variables de entorno para el acceso compatible con OpenAI: la clave, la URL base y el modelo. Con eso basta para apuntarlo a cualquier proveedor compatible.\",\"tip\":\"Funciona con DashScope, OpenRouter, ModelScope y servidores propios: cualquier cosa que exponga un endpoint compatible con OpenAI.\",\"steps\":{\"install\":{\"title\":\"Instala Qwen Code\",\"desc\":\"Requiere Node.js 20 o posterior. Instala el comando global qwen.\"},\"set-env\":{\"title\":\"Configura las tres variables\",\"desc\":\"Indica tu clave, la URL del endpoint y el id del modelo. En Windows usa setx y reabre la terminal.\"},\"run\":{\"title\":\"Empieza a programar\",\"desc\":\"Ejecútalo dentro de la carpeta de tu proyecto para empezar a trabajar con el modelo.\"}}}}},\"compare\":{\"title\":\"En paralelo\",\"needTwoTitle\":\"Selecciona al menos 2 modelos\",\"needTwoDesc\":\"Vuelve a la lista y marca modelos para comparar, o búscalos para añadirlos.\",\"goPick\":\"← Elegir modelos\",\"modelsN\":\"{n} modelos\",\"diffOnly\":\"Solo diferencias\",\"copyLink\":\"Copiar enlace\",\"linkCopied\":\"Enlace copiado\",\"copyFailed\":\"Error al copiar\",\"usageTitle\":\"Estimado por uso (200M ent / 50M sal / 60% aciertos de caché)\",\"channel\":\"Canal\",\"officialList\":\"Oficial / lista\",\"minChannel\":\"Canal más barato\",\"sameRank\":\"Los canales oficial y más barato tienen el mismo orden.\",\"diffRank\":\"⚠ Los canales oficial y más bajo se ordenan de forma distinta. Mirar solo el precio de lista oficial lleva a la conclusión opuesta.\",\"remove\":\"Quitar ✕\",\"dims\":{\"officialInput\":\"Entrada oficial / lista\",\"officialOutput\":\"Salida oficial / lista\",\"blended31\":\"Combinado 3:1\",\"cacheRead\":\"Lectura caché\",\"minInput\":\"Entrada canal más barato\",\"minOutput\":\"Salida canal más barato\",\"minSource\":\"Fuente del canal más barato\",\"spread\":\"Dispersión entre plataformas\",\"context\":\"Ventana de contexto\",\"outputLimit\":\"Límite de salida\",\"reasoning\":\"Razonamiento\",\"toolCall\":\"Uso de herramientas\",\"structured\":\"Salida estructurada\",\"inputModalities\":\"Modalidades de entrada\",\"openWeights\":\"Pesos abiertos\",\"knowledge\":\"Corte de conocimiento\",\"releaseDate\":\"Fecha de lanzamiento\",\"hostCount\":\"Nº de proveedores\",\"benchmarkCount\":\"Benchmarks\"}},\"costTool\":{\"title\":\"Calculadora de costes\",\"subtitle\":\"Introduzca el uso mensual y elija los modelos a calcular. Cada uno se calcula dos veces, en su canal oficial y en su canal de pago más barato. La tasa de aciertos de caché es una entrada aparte porque la entrada en caché se factura muy por debajo del precio normal de entrada.\",\"inputTokens\":\"Tokens de entrada / mes\",\"outputTokens\":\"Tokens de salida / mes\",\"cacheHit\":\"Tasa de aciertos de caché {n}%\",\"scenarios\":\"Preajustes de escenario\",\"preset\":{\"light\":{\"name\":\"Prueba ligera\",\"assume\":\"2M ent / 0,5M sal · 0% caché\"},\"agent\":{\"name\":\"Codificación con agente\",\"assume\":\"200M ent / 50M sal · 60% caché\"},\"batch\":{\"name\":\"Lote grande\",\"assume\":\"1B ent / 100M sal · 80% caché\"}},\"pickModels\":\"Modelos\",\"empty\":\"Busca y añade modelos arriba para estimar tu coste mensual.\",\"th\":{\"model\":\"Modelo\",\"official\":\"Oficial / lista\",\"cheapest\":\"Canal más barato\"},\"note\":\"Coste mensual = entrada×(1−aciertos)×precio + entrada×aciertos×lectura-de-caché + salida×precio. Los canales sin precio de lectura de caché se calculan al precio de entrada. Los canales a $0 quedan excluidos, ya que los niveles gratuitos suelen tener límites de tasa y ningún SLA. Los canales de pasarela pueden llevar límites ocultos, así que verifique usted la disponibilidad.\"},\"tokenTool\":{\"title\":\"Contador de tokens · multi-tokenizador\",\"subtitle\":\"Pegue un texto para ver su recuento de tokens y su coste bajo cada tokenizador. Los recuentos de la familia OpenAI se calculan de forma exacta en el navegador; el resto se marcan como estimaciones con un margen. La diferencia es mayor en chino y otros textos CJK, donde o200k necesita bastantes menos tokens que cl100k para los mismos caracteres.\",\"placeholder\":\"Pega o escribe texto aquí…\",\"charCount\":\"{n} caracteres\",\"cjkRatio\":\"{pct}% CJK\",\"loadSample\":\"Cargar un ejemplo bilingüe\",\"clear\":\"Limpiar\",\"compareTitle\":\"Tokens según el tokenizador\",\"exact\":\"Exacto\",\"estimate\":\"Estimación ±{pct}%\",\"estShort\":\"est.\",\"compareNote\":\"Los recuentos exactos usan gpt-tokenizer (o200k_base / cl100k_base). Las estimaciones se anclan en el recuento exacto de o200k y se escalan por la proporción de CJK, así que tómelas como cifras aproximadas y no precisas. Claude y Gemini no tienen tokenizador público del lado del cliente.\",\"costTitle\":\"Coste de este texto, por modelo\",\"costNote\":\"Coste = tokens ÷ 1M × el precio de lista del modelo. «Como entrada» usa el precio de entrada, «como salida» el de salida. Los recuentos de tokens de modelos no OpenAI son estimaciones.\",\"families\":{\"gpt4o\":\"GPT-4o / GPT-5 (o200k)\",\"gpt4\":\"GPT-4 / GPT-3.5 (cl100k)\",\"claude\":\"Claude\",\"gemini\":\"Gemini\",\"llama\":\"Llama 3\"},\"th\":{\"tokenizer\":\"Tokenizador\",\"tokens\":\"Tokens\",\"cpt\":\"Caracteres / token\",\"accuracy\":\"Precisión\",\"model\":\"Modelo\",\"asInput\":\"Como entrada\",\"asOutput\":\"Como salida\"},\"sampleText\":\"The quick brown fox jumps over the lazy dog. 敏捷的棕色狐狸跳过了那只懒狗。人工智能正在改变我们编写和部署软件的方式。\"},\"subTool\":{\"title\":\"Suscripción vs API\",\"subtitle\":\"Compare una suscripción de IA con la API de pago por uso según su nivel de uso. Las suscripciones se facturan por ventana de tiempo y no por token, así que no existe un punto de equilibrio exacto: los resultados se dan como rangos, junto con la sensibilidad a la caché y la fecha en que se verificó cada plan.\",\"disclaimer\":\"Los precios y cupos de los planes se mantienen a mano y no se han verificado con cada proveedor por separado. Los precios de API se leen del catálogo, por lo que cambiar la base de precio puede invertir la conclusión. Las reglas de cupo cambian con frecuencia; la página oficial tiene prioridad.\",\"promptsPerDay\":\"Prompts / día\",\"avgIn\":\"Tokens de entrada / llamada\",\"avgOut\":\"Tokens de salida / llamada\",\"cacheHit\":\"Tasa de aciertos de caché {n}%\",\"callsPerPrompt\":\"Llamadas al modelo por prompt: {n}\",\"callsPerPromptHint\":\"En chat es cerca de 1. Un agente planifica, busca, invoca herramientas y resume, así que un prompt suele desencadenar de 5 a 30 llamadas. Por eso un modelo con precio bajo por token puede resultar caro por tarea.\",\"basis\":\"Base del precio de API\",\"basisOfficial\":\"Oficial\",\"basisCheapest\":\"Más barato de pago\",\"basisOfficialNote\":\"Precio de lista de primera parte, la alternativa comparable a una suscripción de primera parte.\",\"basisCheapestNote\":\"El canal de pago más bajo entre todos los hosts. A menudo es una pasarela de terceros, así que valore usted la fiabilidad.\",\"scenarios\":\"Escenarios predefinidos\",\"preset\":{\"chat\":{\"name\":\"Chat ligero\",\"assume\":\"30 prompts/día · 3K ent. / 0,7K sal. · 20% caché · 1 llamada\"},\"agent\":{\"name\":\"Agente de código\",\"assume\":\"20 prompts/día · 15K ent. / 3K sal. · 70% caché · 8 llamadas\"},\"heavy\":{\"name\":\"Agente intensivo\",\"assume\":\"60 prompts/día · 25K ent. / 5K sal. · 80% caché · 12 llamadas\"}},\"monthlyCalls\":\"≈ {n} llamadas al modelo / mes con este uso.\",\"coverage\":{\"within\":\"Dentro del cupo\",\"near\":\"Cerca del límite\",\"over\":\"Supera el cupo\"},\"status\":{\"limited\":\"Venta limitada\",\"discontinued\":\"Descontinuado\"},\"perMonth\":\"/mes\",\"pricedAgainst\":\"Calculado con\",\"modelDetail\":\"detalles →\",\"aaTitle\":\"Índice de inteligencia de Artificial Analysis\",\"myApiCost\":\"Su uso vía API:\",\"verdictSaves\":\"La suscripción ahorra {lo}–{hi}/mes\",\"verdictPricier\":\"La suscripción cuesta {lo}–{hi} más al mes\",\"verdictEven\":\"Prácticamente igual que la API\",\"verdictOverQuota\":\"Su uso supera este cupo, por lo que la cifra de ahorro no aplica\",\"noPriceOnBasis\":\"No hay precio público para este modelo en esta base\",\"bestFit\":\"MEJOR OPCIÓN\",\"surplusTag\":\"CUPO SOBRANTE\",\"surplusShow\":\"Mostrar {n} niveles superiores con cupo sobrante\",\"surplusHide\":\"Ocultar niveles superiores con cupo sobrante\",\"breakEven\":\"Equilibrio ≈ {range} prompts/día\",\"sensitivity\":\"con 50% de caché ≈ {n}/día\",\"spreadNote\":\"diferencia de precio {n}× entre hosts\",\"checkedAt\":\"verificado {date}\",\"accountToggle\":\"Cuánto vale este cupo →\",\"acct\":{\"capacityMax\":\"Capacidad mensual, límite superior (ventana conocida más estricta: {hours} h)\",\"partialCaps\":\"El cupo oficial incluye otros límites sin cifras publicadas, por lo que tanto esta capacidad como el descuento anterior están sobreestimados.\",\"perCall\":\"Por llamada al modelo\",\"quotaRaw\":\"Cupo oficial\",\"capacity\":\"Capacidad mensual (ventana más estricta: {hours} h)\",\"capacityValue\":\"{calls} llamadas · {prompts} prompts\",\"quotaWorth\":\"El mismo volumen al precio de API {basis}\",\"planPrice\":\"Precio del plan\",\"verdictDiscount\":\"El cupo cuesta alrededor de un {pct}% menos que comprar el mismo volumen por API.\",\"verdictPremium\":\"El cupo cuesta alrededor de un {pct}% más que comprar el mismo volumen por API.\",\"caveat\":\"Basado en {model} y el perfil de la izquierda. No se incluye el cargo por escritura de caché, así que el coste real de API es algo mayor.\"},\"notComputable\":\"Planes sin cupo calculable\",\"notComputableDesc\":\"Estos no publican un cupo absoluto, o facturan en una unidad que no puede traducirse a llamadas al modelo. Se enumeran aquí en lugar de asignarles una cifra inventada.\",\"rangeNote\":\"Los rangos de coste provienen de la incertidumbre de la caché (±15 pp). Los rangos de capacidad provienen de leer cada cupo de ventana de forma conservadora u optimista. El punto de equilibrio es una región, no un punto, porque los cupos de suscripción son ventanas de tiempo que no se reducen a un número fijo de tokens.\",\"windowNote\":\"Las ventanas móviles de menos de un día se normalizan suponiendo {hours} horas activas al mes (8 h × 22 días); los límites diarios, semanales y mensuales son ventanas de calendario y no se descuentan.\"},\"subsCatalog\":{\"quota\":\"Cupo:\",\"title\":\"Precios de suscripciones IA\",\"subtitle\":\"Precios y cupos de los planes de ChatGPT, Claude, Gemini y otras suscripciones de IA de consumo. Se facturan por usuario y mes, un eje distinto del precio por token de las API. Dentro de cada proveedor, los planes se ordenan por precio.\",\"disclaimer\":\"Los precios y límites son información pública recopilada el {date} y no verificada con cada proveedor por separado. Los planes cambian a menudo; la página oficial tiene prioridad. Para sopesar una suscripción frente a la API de pago por uso, utilice la\",\"calcLink\":\"Calculadora de suscripción vs API →\",\"category\":\"Tipo\",\"catAll\":\"Todos\",\"catAssistant\":\"Asistente\",\"catCoding\":\"Codificación\",\"audience\":\"Para\",\"audAll\":\"Todos\",\"audIndividual\":\"Individual\",\"audTeam\":\"Equipo\",\"free\":\"Gratis\",\"perSeat\":\"/puesto/mes\",\"perMonth\":\"/mes\",\"annual\":\"{price}/mes facturado anualmente\",\"official\":\"Oficial ↗\",\"footnote\":\"La mayoría de proveedores tienen niveles para empresas y con precios personalizados que no se listan aquí. Las suscripciones de consumidor agrupan la experiencia de app/editor y se facturan por ventana de tiempo, así que no se reducen a un precio por token.\"},\"apiDocs\":{\"title\":\"API · MCP\",\"intro\":\"Los datos normalizados de precios, capacidades y clasificaciones que hay detrás de este sitio se publican como JSON estático, de descarga gratuita y sin clave de API. Puede apuntar su código o un agente directamente a ellos.\",\"endpoints\":\"Endpoints\",\"ep\":{\"models\":\"Todos los modelos: entrada canónica, precio del canal oficial + más barato, precios mixtos, contexto, capacidades, puntuaciones de Artificial Analysis y uso de 30 días.\",\"providers\":\"Todos los proveedores: nombre, nivel (primera parte / nube / pasarela), número de modelos, SDK, base de API y docs.\",\"llms\":\"Resumen del sitio en texto plano para rastreadores de IA (convención llms.txt).\"},\"static\":\"Se sirve como archivos estáticos desde una CDN, por lo que no hay límites de tasa. Aun así, almacene las respuestas en caché en lugar de volver a pedirlas en cada solicitud. Los datos se actualizan en cada compilación.\",\"fields\":\"Campos clave (models.json)\",\"field\":{\"identity\":\"Id canónico, nombre visible, laboratorio y tipo de modelo.\",\"price\":\"Referencia (oficial/lista) y canal de pago más barato, cada uno con entrada/salida/lectura-caché po y las capacidades completos del modelo en todos los proveedores.\"},\"leaderboards\":{\"title\":\"Clasificaciones LLM — inteligencia, codificación, relación calidad-precio y velocidad | LLM Pricing\",\"description\":\"Clasifica los LLM por inteligencia, programación, capacidad de agente, relación calidad-precio, coste por tarea, velocidad y uso real.\"},\"frontier\":{\"title\":\"Frontera de valor LLM — mejor inteligencia por dólar | LLM Pricing\",\"description\":\"La frontera de Pareto de inteligencia frente a precio: todos los modelos que merece la pena considerar, sin dejar fuera ninguno mejor y más barato.\"},\"tools\":{\"title\":\"Herramientas LLM — calculadora de costes, tokenizador y comparación | LLM Pricing\",\"description\":\"Calculadoras y comparaciones sobre precios y clasificaciones de LLM: comparar modelos, estimar coste mensual, contar tokens, suscripción o API.\"},\"cost\":{\"title\":\"Calculadora de costes LLM | LLM Pricing\",\"description\":\"Estima el coste mensual de la API LLM entre proveedores a partir de tu uso de tokens y tu tasa de aciertos de caché.\"},\"token\":{\"title\":\"Contador de tokens — multi-tokenizador | LLM Pricing\",\"description\":\"Recuento de tokens y coste de un mismo texto bajo distintos tokenizadores de modelos.\"},\"subscription\":{\"title\":\"Calculadora de suscripción vs API | LLM Pricing\",\"description\":\"Compare el coste de una suscripción de IA con el de la API de pago por uso según su nivel de uso.\"},\"providers\":{\"title\":\"Proveedores LLM — primera parte, nube y pasarelas | LLM Pricing\",\"description\":\"Cada proveedor que aloja LLM: SDK, endpoints de API, docs, número de modelos y cómo se comparan sus niveles de precio.\"},\"compare\":{\"title\":\"Comparar LLM lado a lado | LLM Pricing\",\"description\":\"Pon 2–4 grandes modelos de lenguaje lado a lado: precio, contexto, capacidades y coste del canal oficial vs el más barato.\"},\"subscriptions\":{\"title\":\"Precios de suscripciones IA — ChatGPT, Claude, Gemini | LLM Pricing\",\"description\":\"Planes y cuotas de suscripción de IA para consumidores comparados: ChatGPT, Claude, Gemini y más.\"},\"api\":{\"title\":\"API de precios LLM y MCP | LLM Pricing\",\"description\":\"Accede a los datos de precios y clasificaciones vía API REST y un servidor MCP para que los agentes los consulten directamente.\"},\"tutorials\":{\"title\":\"Guías de configuración de CLI de IA — Claude Code, Codex, Gemini CLI | LLM Pricing\",\"description\":\"Guías fáciles para configurar claves API y endpoints personalizados de Claude Code, Codex CLI, Gemini CLI, Aider, opencode y Qwen Code.\"},\"privacy\":{\"title\":\"Privacy Policy | LLM Pricing\",\"description\":\"How LLM Pricing handles cookies, advertising (Google AdSense) and analytics, and the choices you have.\"},\"about\":{\"title\":\"About LLM Pricing — independent LLM price \u0026 quality comparison\",\"description\":\"What LLM Pricing is, where its data comes from (models.dev, Artificial Analysis, OpenRouter) and how the numbers are put together.\"},\"contact\":{\"title\":\"Contact | LLM Pricing\",\"description\":\"Get in touch with LLM Pricing for questions, feedback or data corrections.\"},\"notFound\":{\"title\":\"Page not found (404) | LLM Pricing\",\"description\":\"This address doesn't match any page on LLM Pricing. Search models and providers, or head back to the pricing table.\"}},\"privacy\":{\"title\":\"Privacy Policy\",\"updated\":\"Last updated: 13 August 2026\",\"intro\":\"LLM Pricing (\\\"we\\\", \\\"us\\\") operates the website at llmpricing.dev. This page explains what information is processed when you visit and how it is used. LLM Pricing is a free, static informational site: there are no user accounts, and you don't need to sign in or submit any personal details to use it.\",\"collectTitle\":\"Information we collect\",\"collectBody\":\"We do not ask for or store personal information such as your name, email address or payment details, and there is no server-side database of visitors. Preferences you set, like light or dark theme and language, are stored locally in your own browser and are never sent to us.\",\"cookiesTitle\":\"Cookies and advertising\",\"cookiesBody\":\"This site uses Google AdSense to display advertising. Third-party vendors, including Google, use cookies to serve ads based on your prior visits to this and other websites.\",\"cookiesGoogle\":\"Google's use of advertising cookies enables it and its partners to serve ads to you based on your visits to this site and/or other sites on the internet. You can decline personalised advertising at any time.\",\"cookiesOptOut\":\"To opt out of personalised advertising, visit\",\"and\":\"and\",\"googleAdsSettings\":\"Google Ads Settings\",\"consentTitle\":\"Consent (EEA, UK \u0026 Switzerland)\",\"consentBody\":\"If you visit from the European Economic Area, the United Kingdom or Switzerland, we ask for your consent before any non-essential or advertising cookies are set.\",\"consentBody2\":\"We use a Google-certified Consent Management Platform (CMP) to show a message where you can agree, decline, or manage your choices in detail. If you decline, you may still see non-personalised ads, and you can reopen the consent tool at any time to review or change your selection.\",\"analyticsTitle\":\"Analytics\",\"analyticsBody\":\"We use Google Analytics to understand aggregate traffic, such as page views and rough geography. This data is processed by Google to help us improve the site and is not used to identify individual visitors.\",\"sharingTitle\":\"Data sharing\",\"sharingBody\":\"We do not sell your personal data. Information processed by the third-party services above is governed by their own privacy policies, including the\",\"googlePolicy\":\"Google Privacy Policy\",\"linksTitle\":\"External links\",\"linksBody\":\"Pages here link to provider and data-source websites. We are not responsible for the content or privacy practices of those external sites.\",\"childrenTitle\":\"Children\",\"childrenBody\":\"This site is intended for a general, professional audience and is not directed at children under 13.\",\"choicesTitle\":\"Your choices\",\"choicesBody\":\"You can disable or delete cookies in your browser settings and opt out of personalised ads using the links above. Blocking cookies will not prevent you from using the site.\",\"changesTitle\":\"Changes to this policy\",\"changesBody\":\"We may update this policy from time to time. Any material change will be reflected by the \\\"last updated\\\" date at the top of this page.\",\"contactTitle\":\"Contact\",\"contactBody\":\"Questions about this policy? Reach us via the\",\"contactLink\":\"contact page\"},\"about\":{\"title\":\"About LLM Pricing\",\"intro\":\"LLM Pricing is a free, independent tool for comparing the price, capabilities and quality of large language models across every provider that hosts them. The goal is simple: help developers and teams pick the right model at the right price without digging through a dozen separate pricing pages.\",\"whatTitle\":\"What you can do here\",\"whatBody\":\"Compare per-token input, output and cache pricing across providers; see the same model priced across every host to find the lowest channel; rank models by intelligence, coding ability, value and speed; and estimate real monthly cost with the built-in calculators.\",\"dataTitle\":\"Where the data comes from\",\"dataBody\":\"Pricing and capability data is aggregated from models.dev (MIT). Quality and speed benchmarks come from Artificial Analysis, and real-world usage popularity is drawn from OpenRouter. We merge the same model across hosts, compute a blended price and normalise capabilities so the figures are comparable.\",\"independenceTitle\":\"Independence\",\"independenceBody\":\"We are not affiliated with, sponsored by or endorsed by any of the model providers listed. Prices and specifications change often and are shown for reference only: always confirm on each provider's official page before relying on them.\",\"contactTitle\":\"Get in touch\",\"contactBody\":\"Found something wrong or have a suggestion? Reach us via the\",\"contactLink\":\"contact page\"},\"contact\":{\"title\":\"Contact\",\"intro\":\"Questions, corrections or feedback about the data? We'd like to hear from you.\",\"emailTitle\":\"Email\",\"emailBody\":\"Reach us at\",\"socialTitle\":\"Social\",\"socialBody\":\"Find us on X (Twitter) at\",\"dataTitle\":\"Data corrections\",\"dataBody\":\"Spotted a wrong price or a missing model? Pricing is aggregated from models.dev, and corrections there flow back here. For anything else, email us at the address above.\"},\"faq\":{\"q1\":\"¿Cuál es la API LLM más barata en {year}?\",\"a1\":\"Según nuestra comparación de {modelCount}+ modelos, {cheapestModel} de {cheapestProvider} ofrece el precio mixto más bajo, unos {cheapestPrice} $ por 1M de tokens.\",\"q2\":\"¿Cómo estimo los costes de una API LLM?\",\"a2\":\"Multiplica tus tokens de entrada por el precio de entrada del modelo por 1M de tokens, haz lo mismo con los de salida y súmalos. Usa la calculadora de costes integrada para estimar los totales de cualquier modelo y proveedor.\",\"q3\":\"¿Qué LLM tiene la ventana de contexto más grande?\",\"a3\":\"{largestModel} de {largestProvider} admite la ventana de contexto más grande, hasta {largestContext} tokens.\",\"q4\":\"¿Qué proveedores y modelos se comparan aquí?\",\"a4\":\"Este sitio compara {modelCount}+ modelos de proveedores como {providers}, con precios de entrada, salida y caché por 1M de tokens además de clasificaciones de calidad.\"},\"toast\":{\"maxCompare\":\"Compara hasta {n} modelos\"},\"modelActions\":{\"copyId\":\"Copiar ID\",\"copied\":\"{id} copiado\",\"copyFailed\":\"Error al copiar, selecciónalo manualmente\",\"addCompare\":\"+ Añadir a comparación\",\"added\":\"✓ En comparación\"},\"modelDetail\":{\"subN\":\" · {n} con suscripción\",\"backList\":\"← Lista de modelos\",\"notFoundTitle\":\"Modelo no encontrado\",\"b
