окенизаторам\",\"desc\":\"Число токенов и стоимость одного и того же текста в разных токенизаторах.\"},\"subscription\":{\"name\":\"Подписка vs API\",\"desc\":\"Сравнение подписки с оплатой API по факту использования при вашем объёме.\"},\"subscriptions\":{\"name\":\"Цены на AI-подписки\",\"desc\":\"Цены и квоты тарифов ChatGPT, Claude, Gemini и других потребительских подписок.\"},\"api\":{\"name\":\"API · MCP\",\"desc\":\"Данные о ценах и рейтингах через REST API и сервер MCP, доступные для запросов агентами.\"}}},\"notFound\":{\"code\":\"404\",\"title\":\"Страница не найдена\",\"body\":\"Этому адресу не соответствует ни одна страница сайта. Возможно, в нём опечатка или страница была перемещена.\",\"requested\":\"Запрошенный адрес\",\"home\":\"На главную\",\"search\":\"Поиск моделей и провайдеров\",\"searchFor\":\"Искать «{q}»\"},\"placeholder\":{\"statusStub\":\"Заготовка\",\"statusPlanned\":\"Запланировано\",\"designSee\":\"Дизайн в\"},\"tutorials\":{\"title\":\"Руководства по настройке CLI\",\"subtitle\":\"Подключите консольные ИИ-инструменты для кодинга к любому API за несколько шагов. Скопируйте, вставьте, замените заполнители на свой ключ и эндпоинт — готово.\",\"official\":\"Официальный\",\"community\":\"Открытый код\",\"viewGuide\":\"Открыть руководство\",\"backToList\":\"Все руководства\",\"stepsTitle\":\"Шаги настройки\",\"officialDocs\":\"Официальная документация\",\"copy\":\"Копировать\",\"copied\":\"Скопировано\",\"tip\":{\"label\":\"Совет:\"},\"basics\":{\"title\":\"Три вещи, нужные любому инструменту\",\"apiKey\":{\"term\":\"API-ключ\",\"desc\":\"Секретный токен, который подтверждает вашу личность и по которому идёт оплата. Держите его в тайне и никогда не коммитьте в git.\"},\"baseUrl\":{\"term\":\"Базовый URL\",\"desc\":\"Эндпоинт, с которым общается инструмент. Измените его, чтобы направить запросы через более дешёвого провайдера вместо стандартного.\"},\"model\":{\"term\":\"Название модели\",\"desc\":\"Какую модель запускать — точно так, как её называет ваш провайдер, например id модели со страницы цен.\"}},\"compatNote\":\"Формат конечной точки должен соответствовать инструменту. Codex CLI, Aider, opencode и Qwen Code принимают OpenAI-совместимую конечную точку напрямую. Claude Code использует формат Anthropic, поэтому укажите в ANTHROPIC_BASE_URL Anthropic-совместимую конечную точку или конвертер. Gemini CLI работает в родном формате Google.\",\"apiStyle\":{\"anthropic\":\"Совместим с Anthropic\",\"openai\":\"Совместим с OpenAI\",\"gemini\":\"Gemini / Google\"},\"tie\":{\"body\":\"Сначала выберите модель или провайдера подешевле, затем подставьте их ключ и эндпоинт в шаги выше.\",\"pricingLink\":\"Сравнить цены\",\"providersLink\":\"Смотреть провайдеров\"},\"seo\":{\"detailTitle\":\"Как настроить {name} с любым API-ключом | LLM Pricing\"},\"guides\":{\"claude-code\":{\"name\":\"Claude Code\",\"tagline\":\"Официальный терминальный агент Anthropic.\",\"intro\":\"Claude Code использует протокол Anthropic Messages. Используйте ключ Anthropic напрямую или направьте его на любой Anthropic-совместимый эндпоинт двумя переменными окружения.\",\"tip\":\"Базовый URL, отличный от api.anthropic.com, считается сторонним шлюзом. Для шлюзов, ожидающих bearer-токен, используйте ANTHROPIC_AUTH_TOKEN.\",\"steps\":{\"install\":{\"title\":\"Установите CLI\",\"desc\":\"Требуется Node.js 18 или новее. Устанавливает глобальную команду claude.\"},\"official-key\":{\"title\":\"Вариант A: используйте ключ Anthropic\",\"desc\":\"Задайте ключ из консоли Anthropic. Windows сохраняет его между сеансами; после setx откройте терминал заново.\"},\"custom-endpoint\":{\"title\":\"Вариант B: используйте свой эндпоинт\",\"desc\":\"Направьте все запросы на более дешёвый Anthropic-совместимый шлюз. Замените URL и ключ на значения вашего провайдера.\"},\"config-file\":{\"title\":\"Сделайте это постоянным\",\"desc\":\"Вместо экспорта каждый раз сохраните эндпоинт и ключ в файле настроек, чтобы их подхватывал каждый сеанс.\"},\"run\":{\"title\":\"Начните кодить\",\"desc\":\"Запустите в папке проекта. Он читает и правит файлы прямо там, где вы находитесь.\"}}},\"codex-cli\":{\"name\":\"Codex CLI\",\"tagline\":\"Официальный терминальный агент OpenAI.\",\"intro\":\"Codex использует OpenAI-совместимый API, поэтому может общаться не только с api.openai.com. Используйте ключ OpenAI напрямую или объявите своего провайдера в файле конфигурации.\",\"tip\":\"Если вы входили через ChatGPT, сначала выполните codex logout, затем при следующем запуске выберите «Provide your own API key», чтобы использовался ваш провайдер.\",\"steps\":{\"install\":{\"title\":\"Установите CLI\",\"desc\":\"Требуется Node.js 18 или новее. Устанавливает глобальную команду codex.\"},\"official-key\":{\"title\":\"Вариант A: используйте ключ OpenAI\",\"desc\":\"Задайте ключ с платформы OpenAI. В Windows после setx откройте терминал заново.\"},\"custom-provider\":{\"title\":\"Вариант B: добавьте своего провайдера\",\"desc\":\"Объявите OpenAI-совместимый эндпоинт в файле конфигурации. env_key задаёт имя переменной окружения с ключом; wire_api = chat подходит для большинства сторонних эндпоинтов.\"},\"logout\":{\"title\":\"Сбросьте сохранённый вход ChatGPT\",\"desc\":\"Только если вы раньше входили через ChatGPT. Это заставит Codex использовать ваш собственный ключ.\"},\"run\":{\"title\":\"Начните кодить\",\"desc\":\"Запустите в папке проекта и начните давать команды.\"}}},\"gemini-cli\":{\"name\":\"Gemini CLI\",\"tagline\":\"Официальный терминальный агент Google.\",\"intro\":\"Самый быстрый путь — ключ API из Google AI Studio, заданный в GEMINI_API_KEY. Можно также просто запустить его и войти под аккаунтом Google для бесплатного тарифа.\",\"tip\":\"Чтобы попробовать, ключ не нужен: запустите gemini и войдите под аккаунтом Google. Для более высоких лимитов и оплаты через API используйте GEMINI_API_KEY.\",\"steps\":{\"install\":{\"title\":\"Установите CLI\",\"desc\":\"Требуется Node.js 20 или новее. Устанавливает глобальную команду gemini.\"},\"get-key\":{\"title\":\"Получите ключ API\",\"desc\":\"Создайте бесплатный ключ в Google AI Studio и скопируйте его.\"},\"set-env\":{\"title\":\"Задайте ключ\",\"desc\":\"Сохраните его в переменной окружения GEMINI_API_KEY. Добавьте в профиль shell, чтобы сохранять между сеансами.\"},\"run\":{\"title\":\"Начните кодить\",\"desc\":\"Запустите в папке проекта, чтобы общаться, читать и править код.\"}}},\"aider\":{\"name\":\"Aider\",\"tagline\":\"Парное программирование с ИИ с открытым кодом в вашем терминале.\",\"intro\":\"Aider работает почти с любой моделью. Используйте ключи OpenAI или Anthropic напрямую либо задайте OpenAI-совместимый базовый URL, чтобы направить запросы через более дешёвого провайдера.\",\"tip\":\"Для OpenAI-совместимых эндпоинтов добавьте перед моделью префикс openai/, чтобы Aider считал её моделью в стиле OpenAI, например --model openai/your-model-name.\",\"steps\":{\"install\":{\"title\":\"Установите Aider\",\"desc\":\"Требуется Python 3.8 или новее. Устанавливает команду aider через pip.\"},\"official-key\":{\"title\":\"Вариант A: используйте ключ провайдера\",\"desc\":\"Задайте ключ провайдера вашей модели, затем выберите модель через --model.\"},\"custom-endpoint\":{\"title\":\"Вариант B: используйте свой эндпоинт\",\"desc\":\"Задайте OPENAI_API_BASE с URL вашего провайдера и добавьте перед именем модели префикс openai/.\"},\"config-file\":{\"title\":\"Сделайте это постоянным\",\"desc\":\"Сохраните эндпоинт, ключ и модель в файле .env в проекте, чтобы не вводить их заново.\"}}},\"opencode\":{\"name\":\"opencode\",\"tagline\":\"Терминальный агент с открытым кодом, работает с любым провайдером.\",\"intro\":\"opencode настраивает каждого провайдера через базовый URL, а не читает OPENAI_BASE_URL. Быстрее всего — интерактивный вход; для полного контроля правьте файл конфигурации.\",\"tip\":\"opencode не читает OPENAI_BASE_URL и OPENAI_API_KEY для своих эндпоинтов. Провайдера нужно объявить — через auth login или в файле конфигурации.\",\"steps\":{\"install\":{\"title\":\"Установите opencode\",\"desc\":\"Требуется Node.js 18 или новее. Устанавливает глобальную команду opencode.\"},\"quick-auth\":{\"title\":\"Вариант A: быстрый вход\",\"desc\":\"Выполните команду входа, прокрутите до «Other» и вставьте свой базовый URL и ключ API.\"},\"config-file\":{\"title\":\"Вариант B: файл конфигурации\",\"desc\":\"Объявите OpenAI-совместимого провайдера с его базовым URL, ключом и моделью. Замените значения на свои.\"},\"run\":{\"title\":\"Начните кодить\",\"desc\":\"Запустите в папке проекта и выберите свою модель командой /models.\"}}},\"qwen-code\":{\"name\":\"Qwen Code\",\"tagline\":\"Агент с открытым кодом, оптимизированный под Qwen, совместим с OpenAI.\",\"intro\":\"Qwen Code читает три переменные окружения для OpenAI-совместимого доступа: ключ, базовый URL и модель. Этого достаточно, чтобы направить его к любому совместимому провайдеру.\",\"tip\":\"Работает с DashScope, OpenRouter, ModelScope и собственными серверами — со всем, что предоставляет OpenAI-совместимый эндпоинт.\",\"steps\":{\"install\":{\"title\":\"Установите Qwen Code\",\"desc\":\"Требуется Node.js 20 или новее. Устанавливает глобальную команду qwen.\"},\"set-env\":{\"title\":\"Задайте три переменные\",\"desc\":\"Укажите ключ, URL эндпоинта и id модели. В Windows используйте setx и откройте терминал заново.\"},\"run\":{\"title\":\"Начните кодить\",\"desc\":\"Запустите в папке проекта, чтобы начать работать с моделью.\"}}}}},\"compare\":{\"title\":\"Рядом\",\"needTwoTitle\":\"Выберите минимум 2 модели\",\"needTwoDesc\":\"Вернитесь к списку и отметьте модели для сравнения или найдите их, чтобы добавить.\",\"goPick\":\"← Выбрать модели\",\"modelsN\":\"{n} моделей\",\"diffOnly\":\"Только отличия\",\"copyLink\":\"Копировать ссылку\",\"linkCopied\":\"Ссылка скопирована\",\"copyFailed\":\"Не удалось скопировать\",\"usageTitle\":\"Оценка по использованию (200M ввод / 50M вывод / 60% попаданий в кэш)\",\"channel\":\"Канал\",\"officialList\":\"Офиц. / прайс\",\"minChannel\":\"Дешевейший канал\",\"sameRank\":\"Официальный и дешевейший каналы ранжируются одинаково.\",\"diffRank\":\"⚠ Официальный и самый дешёвый каналы дают разный порядок. Если смотреть только на официальный прайс, вывод получается противоположным.\",\"remove\":\"Убрать ✕\",\"dims\":{\"officialInput\":\"Офиц. / прайс ввод\",\"officialOutput\":\"Офиц. / прайс вывод\",\"blended31\":\"Смешанная 3:1\",\"cacheRead\":\"Чтение кэша\",\"minInput\":\"Ввод дешевейшего канала\",\"minOutput\":\"Вывод дешевейшего канала\",\"minSource\":\"Источник дешевейшего канала\",\"spread\":\"Разброс между платформами\",\"context\":\"Окно контекста\",\"outputLimit\":\"Лимит вывода\",\"reasoning\":\"Рассуждение\",\"toolCall\":\"Вызов инструментов\",\"structured\":\"Структурированный вывод\",\"inputModalities\":\"Модальности ввода\",\"openWeights\":\"Открытые веса\",\"knowledge\":\"Порог знаний\",\"releaseDate\":\"Дата выпуска\",\"hostCount\":\"Число провайдеров\",\"benchmarkCount\":\"Бенчмарки\"}},\"costTool\":{\"title\":\"Калькулятор стоимости\",\"subtitle\":\"Укажите месячный объём и выберите модели для расчёта. Каждая считается дважды: по официальному каналу и по самому дешёвому платному каналу. Доля попаданий в кэш вынесена в отдельное поле, потому что кэшированный ввод тарифицируется существенно ниже обычной цены ввода.\",\"inputTokens\":\"Входные токены / мес\",\"outputTokens\":\"Выходные токены / мес\",\"cacheHit\":\"Доля попаданий в кэш {n}%\",\"scenarios\":\"Пресеты сценариев\",\"preset\":{\"light\":{\"name\":\"Лёгкая проба\",\"assume\":\"2M вх / 0,5M вых · 0% кэш\"},\"agent\":{\"name\":\"Агентское кодирование\",\"assume\":\"200M вх / 50M вых · 60% кэш\"},\"batch\":{\"name\":\"Большой пакет\",\"assume\":\"1B вх / 100M вых · 80% кэш\"}},\"pickModels\":\"Модели\",\"empty\":\"Найдите и добавьте модели выше, чтобы оценить месячную стоимость.\",\"th\":{\"model\":\"Модель\",\"official\":\"Официальный / прайс\",\"cheapest\":\"Самый дешёвый канал\"},\"note\":\"Месячная стоимость = ввод×(1−попадания)×цена + ввод×попадания×чтение-из-кэша + вывод×цена. Каналы без цены чтения из кэша считаются по цене ввода. Каналы с $0 исключены, поскольку у бесплатных уровней обычно есть ограничения скорости и нет SLA. У шлюзов могут быть скрытые ограничения, поэтому проверяйте доступность самостоятельно.\"},\"tokenTool\":{\"title\":\"Счётчик токенов · по токенизаторам\",\"subtitle\":\"Вставьте текст, чтобы увидеть число токенов и стоимость в каждом токенизаторе. Для семейства OpenAI подсчёт выполняется точно в браузере, остальные помечены как оценка с погрешностью. Разница наибольшая для китайского и другого CJK-текста: на тех же символах o200k расходует заметно меньше токенов, чем cl100k.\",\"placeholder\":\"Вставьте или введите текст здесь…\",\"charCount\":\"{n} символов\",\"cjkRatio\":\"{pct}% CJK\",\"loadSample\":\"Загрузить двуязычный пример\",\"clear\":\"Очистить\",\"compareTitle\":\"Токены по токенизаторам\",\"exact\":\"Точно\",\"estimate\":\"Оценка ±{pct}%\",\"estShort\":\"оц.\",\"compareNote\":\"Точные значения считает gpt-tokenizer (o200k_base / cl100k_base). Оценки опираются на точное значение o200k и масштабируются по доле CJK, поэтому воспринимайте их как порядок величины, а не как точные числа. У Claude и Gemini нет публичного токенизатора для браузера.\",\"costTitle\":\"Стоимость этого текста по моделям\",\"costNote\":\"Стоимость = токены ÷ 1M × прайсовая цена модели. «Как вход» использует цену входа, «как выход» — цену выхода. Число токенов для моделей не от OpenAI — это оценка.\",\"families\":{\"gpt4o\":\"GPT-4o / GPT-5 (o200k)\",\"gpt4\":\"GPT-4 / GPT-3.5 (cl100k)\",\"claude\":\"Claude\",\"gemini\":\"Gemini\",\"llama\":\"Llama 3\"},\"th\":{\"tokenizer\":\"Токенизатор\",\"tokens\":\"Токены\",\"cpt\":\"Символов / токен\",\"accuracy\":\"Точность\",\"model\":\"Модель\",\"asInput\":\"Как вход\",\"asOutput\":\"Как выход\"},\"sampleText\":\"The quick brown fox jumps over the lazy dog. 敏捷的棕色狐狸跳过了那只懒狗。人工智能正在改变我们编写和部署软件的方式。\"},\"subTool\":{\"title\":\"Подписка vs API\",\"subtitle\":\"Сравнение подписки на ИИ с оплатой API по факту использования при вашем объёме. Подписки тарифицируются по временным окнам, а не по токенам, поэтому точной точки безубыточности не существует: результаты приводятся диапазонами, вместе с чувствительностью к кэшу и датой проверки каждого тарифа.\",\"disclaimer\":\"Цены и квоты тарифов поддерживаются вручную и не проверялись у каждого поставщика по отдельности. Цены API берутся из каталога, поэтому смена базы цены может перевернуть вывод. Правила квот меняются часто; приоритет у официальной страницы.\",\"promptsPerDay\":\"Запросов в день\",\"avgIn\":\"Входных токенов на вызов\",\"avgOut\":\"Выходных токенов на вызов\",\"cacheHit\":\"Доля попаданий в кэш {n}%\",\"callsPerPrompt\":\"Вызовов модели на один запрос: {n}\",\"callsPerPromptHint\":\"В чате около 1. Агент планирует, ищет, вызывает инструменты и подводит итог, поэтому один запрос часто порождает от 5 до 30 вызовов. Именно так модель с низкой ценой за токен оказывается дорогой в расчёте на задачу.\",\"basis\":\"База цены API\",\"basisOfficial\":\"Официальная\",\"basisCheapest\":\"Самый дешёвый платный\",\"basisOfficialNote\":\"Прайс первоисточника, сопоставимая альтернатива подписке того же поставщика.\",\"basisCheapestNote\":\"Самый дешёвый платный канал среди всех хостов. Часто это сторонний шлюз, надёжность оценивайте сами.\",\"scenarios\":\"Готовые сценарии\",\"preset\":{\"chat\":{\"name\":\"Лёгкий чат\",\"assume\":\"30 запросов/день · 3K вх. / 0,7K вых. · кэш 20% · 1 вызов\"},\"agent\":{\"name\":\"Агент-кодинг\",\"assume\":\"20 запросов/день · 15K вх. / 3K вых. · кэш 70% · 8 вызовов\"},\"heavy\":{\"name\":\"Тяжёлый агент\",\"assume\":\"60 запросов/день · 25K вх. / 5K вых. · кэш 80% · 12 вызовов\"}},\"monthlyCalls\":\"≈ {n} вызовов модели в месяц при таком использовании.\",\"coverage\":{\"within\":\"В пределах квоты\",\"near\":\"Близко к лимиту\",\"over\":\"Превышает квоту\"},\"status\":{\"limited\":\"Ограниченная продажа\",\"discontinued\":\"Снят с продажи\"},\"perMonth\":\"/мес\",\"pricedAgainst\":\"Расчёт по модели\",\"modelDetail\":\"подробнее →\",\"aaTitle\":\"Индекс интеллекта Artificial Analysis\",\"myApiCost\":\"Ваше использование через API:\",\"verdictSaves\":\"Подписка экономит {lo}–{hi} в месяц\",\"verdictPricier\":\"Подписка дороже на {lo}–{hi} в месяц\",\"verdictEven\":\"Примерно как API\",\"verdictOverQuota\":\"Ваше использование превышает эту квоту, поэтому сумма экономии не применима\",\"noPriceOnBasis\":\"Для этой модели нет публичной цены на этой базе\",\"bestFit\":\"ЛУЧШИЙ ВАРИАНТ\",\"surplusTag\":\"КВОТА С ЗАПАСОМ\",\"surplusShow\":\"Показать {n} более дорогих тарифов с запасом квоты\",\"surplusHide\":\"Скрыть более дорогие тарифы с запасом квоты\",\"breakEven\":\"Безубыточность ≈ {range} запросов/день\",\"sensitivity\":\"при кэше 50% ≈ {n}/день\",\"spreadNote\":\"разброс цен между хостами {n}×\",\"checkedAt\":\"проверено {date}\",\"accountToggle\":\"Сколько стоит эта квота →\",\"acct\":{\"capacityMax\":\"Месячная ёмкость, верхняя граница (самое строгое известное окно: {hours} ч)\",\"partialCaps\":\"Официальная квота включает и другие лимиты без опубликованных цифр, поэтому и эта ёмкость, и скидка выше завышены.\",\"perCall\":\"За один вызов модели\",\"quotaRaw\":\"Официальная квота\",\"capacity\":\"Месячная ёмкость (самое строгое окно: {hours} ч)\",\"capacityValue\":\"{calls} вызовов · {prompts} запросов\",\"quotaWorth\":\"Тот же объём по цене API ({basis})\",\"planPrice\":\"Цена тарифа\",\"verdictDiscount\":\"Квота стоит примерно на {pct}% меньше, чем тот же объём через API.\",\"verdictPremium\":\"Квота стоит примерно на {pct}% больше, чем тот же объём через API.\",\"caveat\":\"Расчёт по {model} и профилю слева. Плата за запись в кэш не учтена, поэтому реальная стоимость API немного выше.\"},\"notComputable\":\"Тарифы без вычислимой квоты\",\"notComputableDesc\":\"Они не публикуют абсолютную квоту либо тарифицируются в единицах, которые нельзя перевести в вызовы модели. Они перечислены здесь, а не снабжены выдуманной цифрой.\",\"rangeNote\":\"Диапазоны стоимости берутся из неопределённости попаданий в кэш (±15 п. п.). Диапазоны ёмкости — из консервативного и оптимистичного прочтения каждой оконной квоты. Точка безубыточности — это область, а не точка, потому что квоты подписок — это временные окна, не сводимые к фиксированному числу токенов.\",\"windowNote\":\"Скользящие окна короче суток нормализуются исходя из {hours} активных часов в месяц (8 ч × 22 дня); суточные, недельные и месячные лимиты — календарные окна и не уменьшаются.\"},\"subsCatalog\":{\"quota\":\"Квота:\",\"title\":\"Цены на AI-подписки\",\"subtitle\":\"Цены и квоты тарифов ChatGPT, Claude, Gemini и других потребительских подписок на ИИ. Они тарифицируются за пользователя в месяц; это отдельная ось по сравнению с оплатой API за токены. Внутри каждого поставщика тарифы отсортированы по цене.\",\"disclaimer\":\"Цены и лимиты являются общедоступной информацией, собранной {date}, и не проверялись у каждого поставщика по отдельности. Тарифы часто меняются; приоритет у официальной страницы. Чтобы сравнить подписку с оплатой API по факту использования, воспользуйтесь\",\"calcLink\":\"Калькулятор подписки vs API →\",\"category\":\"Тип\",\"catAll\":\"Все\",\"catAssistant\":\"Ассистент\",\"catCoding\":\"Кодирование\",\"audience\":\"Для\",\"audAll\":\"Все\",\"audIndividual\":\"Индивидуально\",\"audTeam\":\"Команда\",\"free\":\"Бесплатно\",\"perSeat\":\"/место/мес\",\"perMonth\":\"/мес\",\"annual\":\"{price}/мес при годовой оплате\",\"official\":\"Официально ↗\",\"footnote\":\"У большинства провайдеров есть корпоративные тарифы и тарифы с индивидуальной ценой, которые здесь не указаны. Потребительские подписки включают опыт приложения/редактора и тарифицируются по временному окну, поэтому их нельзя свести к цене за токен.\"},\"apiDocs\":{\"title\":\"API · MCP\",\"intro\":\"Нормализованные данные о ценах, возможностях и рейтингах, на которых работает сайт, публикуются в виде статического JSON: их можно свободно загружать без ключа API. Код или агент может обращаться к ним напрямую.\",\"endpoints\":\"Эндпоинты\",\"ep\":{\"models\":\"Все модели: каноническая запись, цена официального + самого дешёвого канала, смешанные цены, контекст, возможности, оценки Artificial Analysis и использование за 30 дней.\",\"providers\":\"Все провайдеры: имя, уровень (первая сторона / облако / шлюз), число моделей, SDK, база API и документация.\",\"llms\":\"Текстовое резюме сайта для AI-краулеров (соглашение llms.txt).\"},\"static\":\"Отдаётся как статические файлы через CDN, поэтому ограничений скорости нет. Тем не менее кэшируйте ответы, а не запрашивайте их заново при каждом обращении. Данные обновляются при каждой сборке.\",\"fields\":\"Ключевые поля (models.json)\",\"field\":{\"identity\":\"Канонический id, отображаемое имя, лаборатория и тип модели.\",\"price\":\"Референс (официальный/прайс) и самый дешёвый платный канал, каждый с входом/выходом/чтением кэша за 1M токенов.\",\"blended\":\"Смешанная удельная цена (вход×0,75 + выход×0,25) для референсного, самого дешёвого и самого дешёвого доверенного (без шлюзов) каналов.\",\"spec\":\"Окно контекста, максимальный вывод и трёхзначные флаги возможностей (true/false/null).\",\"aa\":\"Индексы Artificial Analysis по интеллекту, кодированию, агентности, скорость вывода и стоимость за задачу (null, если не охвачено).\",\"usage\":\"Ранг использования OpenRouter за 30 дней, всего токенов и доля (null, если не отслеживается).\",\"hosts\":\"Сколько провайдеров размещают модель и разброс цен между платформами.\"},\"examples\":\"Примеры\",\"curl\":\"Пять самых дешёвых моделей по смешанной цене, через curl и jq:\",\"js\":\"JavaScript (fetch):\",\"py\":\"Python (requests):\",\"cors\":\"Эндпоинты отправляют Access-Control-Allow-Origin: *, поэтому работают и из браузера.\",\"mcp\":\"MCP-сервер\",\"mcpIntro\":\"Поскольку данные — это чистый JSON по HTTPS, любой MCP-сервер с поддержкой fetch может открыть их агенту. Например, референсный fetch-сервер:\",\"mcpHow\":\"Затем попросите агента прочитать {url} и порассуждать над этим: самая дешёвая модель в рамках бюджета, лучший интеллект на доллар, какие поставщики размещают конкретную модель.\",\"mcpRoadmap\":\"MCP-сервер первой стороны с типизированными инструментами (search_models, cheapest, compare) есть в планах. До тех пор стабильным интерфейсом остаются JSON-эндпоинты выше.\",\"license\":\"Лицензия и атрибуция\",\"licenseBody\":\"Данные собраны из models.dev (MIT), Artificial Analysis и OpenRouter. Их можно использовать повторно по лицензии CC BY 4.0, сохраняя указание на LLM Pricing и исходные источники.\"},\"seo\":{\"releases\":{\"title\":\"Релизы моделей ИИ — что и когда вышло | LLM Pricing\",\"description\":\"Хронология релизов моделей ИИ от новых к старым. Каждая запись ведёт к ценам и возможностям модели у всех провайдеров.\"},\"leaderboards\":{\"title\":\"Рейтинги LLM — интеллект, кодирование, выгода и скорость | LLM Pricing\",\"description\":\"Ранжируйте LLM по интеллекту, кодированию, агентским способностям, выгоде, стоимости за задачу, скорости и реальному использованию.\"},\"frontier\":{\"title\":\"Граница ценности LLM — лучший интеллект за доллар | LLM Pricing\",\"description\":\"Граница Парето интеллекта LLM против цены: каждая модель, достойная рассмотрения, без пропуска более дешёвых-и-сильных.\"},\"tools\":{\"title\":\"Инструменты LLM — калькулятор стоимости, токенизатор и сравнение | LLM Pricing\",\"description\":\"Калькуляторы и сравнения на данных о ценах и рейтингах LLM: сравнение моделей, оценка месячной стоимости, подсчёт токенов, сравнение подписки и API.\"},\"cost\":{\"title\":\"Калькулятор стоимости LLM | LLM Pricing\",\"description\":\"Оцените месячную стоимость API LLM у разных провайдеров исходя из использования токенов и доли попаданий в кэш.\"},\"token\":{\"title\":\"Счётчик токенов — по токенизаторам | LLM Pricing\",\"description\":\"Число токенов и стоимость одного и того же текста в разных токенизаторах моделей.\"},\"subscription\":{\"title\":\"Калькулятор подписки vs API | LLM Pricing\",\"description\":\"Сравнение стоимости подписки на ИИ с оплатой API по факту использования при вашем объёме.\"},\"providers\":{\"title\":\"Провайдеры LLM — первая сторона, облако и шлюзы | LLM Pricing\",\"description\":\"Каждый провайдер, размещающий LLM: SDK, эндпоинты API, документация, число моделей и сравнение их уровней цен.\"},\"compare\":{\"title\":\"Сравнение LLM бок о бок | LLM Pricing\",\"description\":\"Поставьте 2–4 больших языковых модели рядом: цена, контекст, возможности и стоимость официального против самого дешёвого канала.\"},\"subscriptions\":{\"title\":\"Цены на AI-подписки — ChatGPT, Claude, Gemini | LLM Pricing\",\"description\":\"Сравнение потребительских тарифов и квот AI-подписок: ChatGPT, Claude, Gemini и другие.\"},\"api\":{\"title\":\"API цен LLM и MCP | LLM Pricing\",\"description\":\"Получайте данные о ценах и рейтингах через REST API и MCP-сервер, чтобы агенты могли запрашивать их напрямую.\"},\"tutorials\":{\"title\":\"Руководства по настройке AI CLI — Claude Code, Codex, Gemini CLI | LLM Pricing\",\"description\":\"Понятные новичкам руководства по настройке API-ключей и своих эндпоинтов для Claude Code, Codex CLI, Gemini CLI, Aider, opencode и Qwen Code.\"},\"privacy\":{\"title\":\"Privacy Policy | LLM Pricing\",\"description\":\"How LLM Pricing handles cookies, advertising (Google AdSense) and analytics, and the choices you have.\"},\"about\":{\"title\":\"About LLM Pricing — independent LLM price \u0026 quality comparison\",\"description\":\"What LLM Pricing is, where its data comes from (models.dev, Artificial Analysis, OpenRouter) and how the numbers are put together.\"},\"contact\":{\"title\":\"Contact | LLM Pricing\",\"description\":\"Get in touch with LLM Pricing for questions, feedback or data corrections.\"},\"notFound\":{\"title\":\"Page not found (404) | LLM Pricing\",\"description\":\"This address doesn't match any page on LLM Pricing. Search models and providers, or head back to the pricing table.\"}},\"privacy\":{\"title\":\"Privacy Policy\",\"updated\":\"Last updated: 13 August 2026\",\"intro\":\"LLM Pricing (\\\"we\\\", \\\"us\\\") operates the website at llmpricing.dev. This page explains what information is processed when you visit and how it is used. LLM Pricing is a free, static informational site: there are no user accounts, and you don't need to sign in or submit any personal details to use it.\",\"collectTitle\":\"Information we collect\",\"collectBody\":\"We do not ask for or store personal information such as your name, email address or payment details, and there is no server-side database of visitors. Preferences you set, like light or dark theme and language, are stored locally in your own browser and are never sent to us.\",\"cookiesTitle\":\"Cookies and advertising\",\"cookiesBody\":\"This site uses Google AdSense to display advertising. Third-party vendors, including Google, use cookies to serve ads based on your prior visits to this and other websites.\",\"cookiesGoogle\":\"Google's use of advertising cookies enables it and its partners to serve ads to you based on your visits to this site and/or other sites on the internet. You can decline personalised advertising at any time.\",\"cookiesOptOut\":\"To opt out of personalised advertising, visit\",\"and\":\"and\",\"googleAdsSettings\":\"Google Ads Settings\",\"consentTitle\":\"Consent (EEA, UK \u0026 Switzerland)\",\"consentBody\":\"If you visit from the European Economic Area, the United Kingdom or Switzerland, we ask for your consent before any non-essential or advertising cookies are set.\",\"consentBody2\":\"We use a Google-certified Consent Management Platform (CMP) to show a message where you can agree, decline, or manage your choices in detail. If you decline, you may still see non-personalised ads, and you can reopen the consent tool at any time to review or change your selection.\",\"analyticsTitle\":\"Analytics\",\"analyticsBody\":\"We use Google Analytics to understand aggregate traffic, such as page views and rough geography. This data is processed by Google to help us improve the site and is not used to identify individual visitors.\",\"sharingTitle\":\"Data sharing\",\"sharingBody\":\"We do not sell your personal data. Information processed by the third-party services above is governed by their own privacy policies, including the\",\"googlePolicy\":\"Google Privacy Policy\",\"linksTitle\":\"External links\",\"linksBody\":\"Pages here link to provider and data-source websites. We are not responsible for the content or privacy practices of those external sites.\",\"childrenTitle\":\"Children\",\"childrenBody\":\"This site is intended for a general, professional audience and is not directed at children under 13.\",\"choicesTitle\":\"Your choices\",\"choicesBody\":\"You can disable or delete cookies in your browser settings and opt out of personalised ads using the links above. Blocking cookies will not prevent you from using the site.\",\"changesTitle\":\"Changes to this policy\",\"changesBody\":\"We may update this policy from time to time. Any material change will be reflected by the \\\"last updated\\\" date at the top of this page.\",\"contactTitle\":\"Contact\",\"contactBody\":\"Questions about this policy? Reach us via the\",\"contactLink\":\"contact page\"},\"about\":{\"title\":\"About LLM Pricing\",\"intro\":\"LLM Pricing is a free, independent tool for comparing the price, capabilities and quality of large language models across every provider that hosts them. The goal is simple: help developers and teams pick the right model at the right price without digging through a dozen separate pricing pages.\",\"whatTitle\":\"What you can do here\",\"whatBody\":\"Compare per-token input, output and cache pricing across providers; see the same model priced across every host to find the lowest channel; rank models by intelligence, coding ability, value and speed; and estimate real monthly cost with the built-in calculators.\",\"dataTitle\":\"Where the data comes from\",\"dataBody\":\"Pricing and capability data is aggregated from models.dev (MIT). Quality and speed benchmarks come from Artificial Analysis, and real-world usage popularity is drawn from OpenRouter. We merge the same model across hosts, compute a blended price and normalise capabilities so the figures are comparable.\",\"independenceTitle\":\"Independence\",\"independenceBody\":\"We are not affiliated with, sponsored by or endorsed by any of the model providers listed. Prices and specifications change often and are shown for reference only: always confirm on each provider's official page before relying on them.\",\"contactTitle\":\"Get in touch\",\"contactBody\":\"Found something wrong or have a suggestion? Reach us via the\",\"contactLink\":\"contact page\"},\"contact\":{\"title\":\"Contact\",\"intro\":\"Questions, corrections or feedback about the data? We'd like to hear from you.\",\"emailTitle\":\"Email\",\"emailBody\":\"Reach us at\",\"socialTitle\":\"Social\",\"socialBody\":\"Find us on X (Twitter) at\",\"dataTitle\":\"Data corrections\",\"dataBody\":\"Spotted a wrong price or a missing model? Pricing is aggregated from models.dev, and corrections there flow back here. For anything else, email us at the address above.\"},\"faq\":{\"q1\":\"Какой самый дешёвый LLM API в {year} году?\",\"a1\":\"По нашему сравнению {modelCount}+ моделей, {cheapestModel} от {cheapestProvider} предлагает самую низкую смешанную цену — около ${cheapestPrice} за 1M токенов.\",\"q2\":\"Как оценить стоимость LLM API?\",\"a2\":\"Умножьте входные токены на цену входа модели за 1M токенов, сделайте то же для выходных токенов и сложите. Используйте встроенный калькулятор стоимости, чтобы оценить итоги для любой модели и провайдера.\",\"q3\":\"У какого LLM самое большое окно контекста?\",\"a3\":\"{largestModel} от {largestProvider} поддерживает самое большое окно контекста — до {largestContext} токенов.\",\"q4\":\"Какие провайдеры и модели здесь сравниваются?\",\"a4\":\"Сайт сравнивает {modelCount}+ моделей у провайдеров вроде {providers}, с ценами за вход, выход и кэш за 1M токенов, а также рейтингами качества.\"},\"pageIntro\":{\"leaderboards\":{\"title\":\"Как читать рейтинги\",\"p1\":\"Каждый рейтинг сортирует один и тот же каталог по своей оси: чистый интеллект, оценки кодирования и агентности от Artificial Analysis, скорость вывода, стоимость задачи, реальное использование за 30 дней и соотношение цены и качества. Рейтинг ценности делит интеллект на смешанную цену, с нижним порогом интеллекта, чтобы дешёвая, но слабая модель не выходила в лидеры только за счёт цены.\",\"p2\":\"Базу цены можно переключать, потому что самый дешёвый канал почти всегда сторонний шлюз, тогда как официальный прейскурант отражает цену первой стороны. Стоимость задачи может заметно менять порядок: рассуждающая модель с низкой удельной ценой всё равно выставляет крупный счёт, если на каждый ответ выдаёт много токенов размышления.\"},\"providers\":{\"title\":\"Как сгруппированы провайдеры\",\"p1\":\"Провайдеры делятся на три уровня: лаборатории первой стороны, которые создают модели, облачные платформы, которые перепродают их с гарантиями инфраструктуры, и сторонние шлюзы, которые собирают множество моделей за одним API. Уровень показывает, откуда на самом деле берётся заявленная низкая цена.\",\"p2\":\"Котировки шлюзов часто самые дешёвые, но могут нести скрытые ограничения, такие как лимиты по частоте, неравномерную доступность или отсутствие соглашения об уровне сервиса. Подсчёт лучшей цены для каждого провайдера включает только модели минимум с двумя платными каналами, поэтому он отражает реальную конкуренцию, а не то, что провайдер является единственным хостом.\"},\"tools\":{\"title\":\"Для чего эти инструменты\",\"p1\":\"Калькуляторы используют те же данные о ценах и рейтингах, что и остальной сайт. Калькулятор стоимости оценивает ваше месячное потребление токенов и по официальному, и по самому дешёвому каналу, с отдельным полем для попаданий в кэш, поскольку кэшированный ввод тарифицируется значительно ниже обычной цены ввода.\",\"p2\":\"Счётчик токенов показывает, как один и тот же текст по-разному разбивается на токены в разных семействах моделей; это особенно важно для китайского и других текстов CJK, где новым токенизаторам требуется меньше токенов на символ. Сравнение подписок взвешивает фиксированный месячный план против API с оплатой по мере использования на вашем уровне потребления и представляет результат как диапазон, а не как единую точку окупаемости.\"}},\"toast\":{\"maxCompare\":\"Сравнение до {n} моделей\"},\"modelActions\":{\"copyId\":\"Копировать ID\",\"copied\":\"{id} скопирован\",\"copyFailed\":\"Не удалось скопировать, выделите вручную\",\"addCompare\":\"+ В сравнение\",\"added\":\"✓ В сравнении\"},\"modelDetail\":{\"subN\":\" · {n} по подписке\",\"backList\":\"← Список моделей\",\"narrative\":{\"offeredBy\":\"{name} представлен у {count} провайдеров на этой странице.\",\"offeredByLab\":\"{name} от {lab} представлен у {count} провайдеров на этой странице.\",\"pricedNote\":\"Публичные цены показаны для {priced} из них.\",\"singleProvider\":\"{name} сейчас доступен только у одного провайдера.\",\"singleProviderLab\":\"{name} от {lab} сейчас доступен только у одного провайдера.\",\"refInOutOfficial\":\"Официальная прайс-цена — {input} за 1M входных токенов и {output} за 1M выходных токенов.\",\"refInOutReference\":\"Референсная цена — {input} за 1M входных токенов и {output} за 1M выходных токенов.\",\"refFlatOfficial\":\"Официальная прайс-цена — {input} за 1M токенов.\",\"refFlatReference\":\"Референсная цена — {input} за 1M токенов.\",\"lowestOfficial\":\"Самый дешёвый платный канал — {provider}: {input} / {output} за 1M, примерно в {mult}× ниже прайс-цены.\",\"lowestReference\":\"Самый дешёвый платный канал — {provider}: {input} / {output} за 1M, примерно в {mult}× ниже референсной цены.\",\"gatewayNote\":\"Этот канал — сторонний шлюз, поэтому проверьте его доступность и лимиты запросов, прежде чем полагаться на него.\",\"spreadOnly\":\"Цены различаются примерно в {mult}× у провайдеров, которые его размещают.\",\"freeBitOne\":\"{count} бесплатный канал ($0)\",\"freeBitMany\":\"{count} бесплатных каналов ($0)\",\"subBit\":\"{count} покрыты платной подпиской\",\"freeSubNote\":\"Также есть {list}; у бесплатных уровней обычно есть лимиты запросов, а доступ по подписке стоит $0 за токен только после оплаты подписки.\",\"aaIndex\":\"Artificial Analysis оценивает его в {idx} по индексу интеллекта.\",\"aaIndexExtra\":\"Artificial Analysis оценивает его в {idx} по индексу интеллекта, при этом {list}.\",\"aaCoding\":\"{score} за программирование\",\"aaAgentic\":\"{score} за агентные задачи\",\"aaValue\":\"При самой низкой смешанной цене {price} за 1M это примерно {val} пунктов индекса на доллар — то соотношение цены и качества, по которому ранжируют таблицы.\",\"aaSpeed\":\"Медианная скорость вывода — {speed} токенов в секунду.\",\"aaSpeedTtft\":\"Медианная скорость вывода — {speed} токенов в секунду, с {ttft}с до первого токена.\",\"aaTaskCost\":\"Выполнение одной задачи набора Artificial Analysis стоит около ${cost}, что отражает, сколько токенов расходует его рассуждение, а не только цену за единицу.\",\"contextDivergent\":\"Контекстное окно — {context} токенов у референсного хоста, но хосты сообщают разные лимиты, от {min} до {max}, поэтому доступное окно зависит от выбранного провайдера.\",\"context\":\"Контекстное окно — {context} токенов.\",\"contextOut\":\"Контекстное окно — {context} токенов, с лимитом вывода {out} токенов.\",\"caps\":\"Поддерживает {list}.\",\"capReasoning\":\"рассуждение\",\"capToolCall\":\"вызов инструментов\",\"capStructured\":\"структурированный вывод\",\"modalities\":\"Поддерживаемые входные модальности: {list}.\",\"openWeights\":\"Веса открыты, поэтому его можно развернуть у себя или через выбранный вами шлюз.\",\"divergentCapability\":\"Провайдеры сообщают флаги возможностей несогласованно, поэтому проверяйте конкретную функцию у хоста, который планируете использовать.\",\"knowledge\":\"Обучающие знания заканчиваются на {date}.\"},\"notFoundTitle\":\"Модель не найдена\",\"backHome\":\"← Назад к списку\",\"specs\":\"Характеристики и цены\",\"priceUnitNote\":\"Ввод / вывод за 1M токенов\",\"officialPrice\":\"Официальная цена\",\"refPrice\":\"Ориентировочная цена\",\"blended\":\"Смешанная цена\",\"cacheRead\":\"Чтение кэша\",\"priceUndisclosed\":\"Цена не раскрыта\",\"lowestPaid\":\"Самый дешёвый (платно)\",\"spread\":\"разброс {n}×\",\"noPaid\":\"Нет платных каналов\",\"moreFree\":\"ещё {n} каналов по $0\",\"context\":\"Контекст\",\"outputLimit\":\"Лимит вывода\",\"capabilities\":\"Возможности\",\"capDivergent\":\"⚠ Провайдеры указывают возможности несогласованно\",\"modalities\":\"Модальности\",\"knowledge\":\"Актуальность знаний\",\"releaseUpdate\":\"Выпуск / обновление\",\"quality\":\"Качество и производительность\",\"qualityMeta\":\"Artificial Analysis · Индекс интеллекта v{v}\",\"variantSuffix\":\" · репр. уровень {variant}\",\"qIntelligence\":\"Интеллект\",\"qValue\":\"Цена/качество\",\"qCoding\":\"Программирование\",\"qAgentic\":\"Агентность\",\"qSpeed\":\"Скорость вывода\",\"qTtft\":\"TTFT\",\"qTaskCost\":\"Стоимость задачи\",\"valueFormula\":\"Формула ценности\",\"valueFormulaText\":\"IQ {idx} ÷ мин. смеш. цена ${price} = {val}\",\"qualityNone\":\"Artificial Analysis не охватывает эту модель (данные есть у 267 из 2059). Данные о качестве — из независимых оценок широко используемых моделей.\",\"aaCurveNote\":\"Уровень рассуждений → интеллект / скорость (выше уровень = сильнее, но медленнее)\",\"variantDefault\":\"по умолчанию\",\"qualityFootnote\":\"Качество независимо оценивается Artificial Analysis. Скорость/задержка — медианы на уровне модели.\",\"availableInN\":\"Доступно у {n} провайдеров\",\"pricedN\":\"{n} с публичными ценами\",\"freeN\":\" · {n} бесплатно\",\"hostTableNote\":\"Сортировка по смешанной цен
