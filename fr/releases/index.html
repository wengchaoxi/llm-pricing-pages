\"404\",\"title\":\"Page introuvable\",\"body\":\"Cette adresse ne correspond à aucune page du site. Elle contient peut-être une faute de frappe, ou la page a été déplacée.\",\"requested\":\"Adresse demandée\",\"home\":\"Retour à l’accueil\",\"search\":\"Rechercher modèles et fournisseurs\",\"searchFor\":\"Rechercher « {q} »\"},\"placeholder\":{\"statusStub\":\"Ébauche\",\"statusPlanned\":\"Prévu\",\"designSee\":\"Conception dans\"},\"tutorials\":{\"title\":\"Guides de configuration CLI\",\"subtitle\":\"Connectez les outils de codage IA en ligne de commande à n'importe quelle API en quelques étapes. Copiez, collez, remplacez les espaces réservés par votre propre clé et endpoint. C'est fait.\",\"official\":\"Officiel\",\"community\":\"Open source\",\"viewGuide\":\"Voir le guide\",\"backToList\":\"Tous les guides\",\"stepsTitle\":\"Étapes de configuration\",\"officialDocs\":\"Docs officielles\",\"copy\":\"Copier\",\"copied\":\"Copié\",\"tip\":{\"label\":\"Astuce :\"},\"basics\":{\"title\":\"Les 3 choses dont chaque outil a besoin\",\"apiKey\":{\"term\":\"Clé API\",\"desc\":\"Un jeton secret qui prouve votre identité et qui est facturé. Gardez-le privé, ne le commitez jamais dans git.\"},\"baseUrl\":{\"term\":\"URL de base\",\"desc\":\"L'endpoint avec lequel l'outil communique. Modifiez-le pour passer par un fournisseur moins cher au lieu de celui par défaut.\"},\"model\":{\"term\":\"Nom du modèle\",\"desc\":\"Quel modèle exécuter, exactement comme votre fournisseur le nomme, p. ex. l'id du modèle affiché sur sa page de tarifs.\"}},\"compatNote\":\"Adaptez le format de l’endpoint à l’outil. Codex CLI, Aider, opencode et Qwen Code acceptent directement un endpoint compatible OpenAI. Claude Code utilise le format Anthropic : pointez ANTHROPIC_BASE_URL vers un endpoint compatible Anthropic ou un convertisseur. Gemini CLI est natif Google.\",\"apiStyle\":{\"anthropic\":\"Compatible Anthropic\",\"openai\":\"Compatible OpenAI\",\"gemini\":\"Gemini / Google\"},\"tie\":{\"body\":\"Choisissez d'abord un modèle ou un fournisseur moins cher, puis renseignez sa clé et son endpoint dans les étapes ci-dessus.\",\"pricingLink\":\"Comparer les prix\",\"providersLink\":\"Parcourir les fournisseurs\"},\"seo\":{\"detailTitle\":\"Comment configurer {name} avec n'importe quelle clé API | LLM Pricing\"},\"guides\":{\"claude-code\":{\"name\":\"Claude Code\",\"tagline\":\"L'agent terminal officiel d'Anthropic.\",\"intro\":\"Claude Code parle le protocole Anthropic Messages. Utilisez une clé Anthropic directement, ou pointez-le vers n'importe quel endpoint compatible Anthropic avec deux variables d'environnement.\",\"tip\":\"Une URL de base autre que api.anthropic.com est traitée comme une passerelle tierce. Utilisez ANTHROPIC_AUTH_TOKEN pour les passerelles qui attendent un jeton bearer.\",\"steps\":{\"install\":{\"title\":\"Installez la CLI\",\"desc\":\"Nécessite Node.js 18 ou plus récent. Installe la commande globale claude.\"},\"official-key\":{\"title\":\"Option A : utilisez votre clé Anthropic\",\"desc\":\"Définissez votre clé depuis la console Anthropic. Windows la conserve entre les sessions ; rouvrez le terminal après setx.\"},\"custom-endpoint\":{\"title\":\"Option B : utilisez un endpoint personnalisé\",\"desc\":\"Routez chaque requête vers une passerelle compatible Anthropic moins chère. Remplacez l'URL et la clé par les valeurs de votre fournisseur.\"},\"config-file\":{\"title\":\"Rendez-le permanent\",\"desc\":\"Au lieu d'exporter à chaque fois, enregistrez l'endpoint et la clé dans le fichier de réglages pour que chaque session les récupère.\"},\"run\":{\"title\":\"Commencez à coder\",\"desc\":\"Lancez-le dans le dossier de votre projet. Il lit et modifie les fichiers là où vous êtes.\"}}},\"codex-cli\":{\"name\":\"Codex CLI\",\"tagline\":\"L'agent terminal officiel d'OpenAI.\",\"intro\":\"Codex utilise l'API compatible OpenAI, il peut donc communiquer avec plus que api.openai.com. Utilisez votre clé OpenAI directement, ou déclarez un fournisseur personnalisé dans le fichier de configuration.\",\"tip\":\"Si vous étiez connecté avec ChatGPT, exécutez d'abord codex logout, puis choisissez « Provide your own API key » au prochain lancement pour qu'il utilise votre fournisseur personnalisé.\",\"steps\":{\"install\":{\"title\":\"Installez la CLI\",\"desc\":\"Nécessite Node.js 18 ou plus récent. Installe la commande globale codex.\"},\"official-key\":{\"title\":\"Option A : utilisez votre clé OpenAI\",\"desc\":\"Définissez votre clé depuis la plateforme OpenAI. Rouvrez le terminal après setx sous Windows.\"},\"custom-provider\":{\"title\":\"Option B : ajoutez un fournisseur personnalisé\",\"desc\":\"Déclarez un endpoint compatible OpenAI dans le fichier de configuration. env_key nomme la variable d'environnement contenant la clé ; wire_api = chat convient à la plupart des endpoints tiers.\"},\"logout\":{\"title\":\"Effacez une connexion ChatGPT enregistrée\",\"desc\":\"Uniquement si vous vous étiez connecté avec ChatGPT. Cela force Codex à utiliser votre propre clé.\"},\"run\":{\"title\":\"Commencez à coder\",\"desc\":\"Lancez-le dans le dossier de votre projet et commencez à donner des instructions.\"}}},\"gemini-cli\":{\"name\":\"Gemini CLI\",\"tagline\":\"L'agent terminal officiel de Google.\",\"intro\":\"Le plus rapide est une clé API de Google AI Studio définie dans GEMINI_API_KEY. Vous pouvez aussi simplement le lancer et vous connecter avec votre compte Google pour le niveau gratuit.\",\"tip\":\"Aucune clé nécessaire pour l'essayer : exécutez gemini et connectez-vous avec un compte Google. Pour des limites plus élevées et la facturation API, utilisez une GEMINI_API_KEY.\",\"steps\":{\"install\":{\"title\":\"Installez la CLI\",\"desc\":\"Nécessite Node.js 20 ou plus récent. Installe la commande globale gemini.\"},\"get-key\":{\"title\":\"Obtenez une clé API\",\"desc\":\"Créez une clé gratuite dans Google AI Studio et copiez-la.\"},\"set-env\":{\"title\":\"Définissez la clé\",\"desc\":\"Stockez-la dans la variable d'environnement GEMINI_API_KEY. Ajoutez-la au profil de votre shell pour la conserver entre les sessions.\"},\"run\":{\"title\":\"Commencez à coder\",\"desc\":\"Lancez-le dans le dossier de votre projet pour discuter, lire et modifier du code.\"}}},\"aider\":{\"name\":\"Aider\",\"tagline\":\"Programmation en binôme avec IA, open source, dans votre terminal.\",\"intro\":\"Aider fonctionne avec presque tous les modèles. Utilisez des clés OpenAI ou Anthropic directement, ou définissez une URL de base compatible OpenAI pour passer par un fournisseur moins cher.\",\"tip\":\"Pour les endpoints compatibles OpenAI, préfixez le modèle par openai/ pour qu'Aider le traite en style OpenAI, p. ex. --model openai/your-model-name.\",\"steps\":{\"install\":{\"title\":\"Installez Aider\",\"desc\":\"Nécessite Python 3.8 ou plus récent. Installe la commande aider via pip.\"},\"official-key\":{\"title\":\"Option A : utilisez une clé de fournisseur\",\"desc\":\"Définissez la clé du fournisseur de votre modèle, puis choisissez un modèle avec --model.\"},\"custom-endpoint\":{\"title\":\"Option B : utilisez un endpoint personnalisé\",\"desc\":\"Définissez OPENAI_API_BASE avec l'URL de votre fournisseur et préfixez le nom du modèle par openai/.\"},\"config-file\":{\"title\":\"Rendez-le permanent\",\"desc\":\"Enregistrez l'endpoint, la clé et le modèle dans un fichier .env de votre projet pour ne pas les ressaisir.\"}}},\"opencode\":{\"name\":\"opencode\",\"tagline\":\"Agent terminal open source, fonctionne avec tout fournisseur.\",\"intro\":\"opencode configure chaque fournisseur avec une URL de base plutôt que de lire OPENAI_BASE_URL. Le plus rapide est la connexion interactive ; pour un contrôle total, modifiez le fichier de configuration.\",\"tip\":\"opencode ne lit pas OPENAI_BASE_URL ni OPENAI_API_KEY pour les endpoints personnalisés. Vous devez déclarer le fournisseur, via auth login ou le fichier de configuration.\",\"steps\":{\"install\":{\"title\":\"Installez opencode\",\"desc\":\"Nécessite Node.js 18 ou plus récent. Installe la commande globale opencode.\"},\"quick-auth\":{\"title\":\"Option A : connexion rapide\",\"desc\":\"Exécutez la commande de connexion, descendez jusqu'à « Other », puis collez votre URL de base et votre clé API.\"},\"config-file\":{\"title\":\"Option B : fichier de configuration\",\"desc\":\"Déclarez un fournisseur compatible OpenAI avec son URL de base, sa clé et son modèle. Remplacez les valeurs par les vôtres.\"},\"run\":{\"title\":\"Commencez à coder\",\"desc\":\"Lancez-le dans le dossier de votre projet et sélectionnez votre modèle personnalisé avec la commande /models.\"}}},\"qwen-code\":{\"name\":\"Qwen Code\",\"tagline\":\"Agent open source optimisé pour Qwen, compatible OpenAI.\",\"intro\":\"Qwen Code lit trois variables d'environnement pour l'accès compatible OpenAI : la clé, l'URL de base et le modèle. C'est tout ce qu'il faut pour le pointer vers n'importe quel fournisseur compatible.\",\"tip\":\"Il fonctionne avec DashScope, OpenRouter, ModelScope et des serveurs auto-hébergés : tout ce qui expose un endpoint compatible OpenAI.\",\"steps\":{\"install\":{\"title\":\"Installez Qwen Code\",\"desc\":\"Nécessite Node.js 20 ou plus récent. Installe la commande globale qwen.\"},\"set-env\":{\"title\":\"Définissez les trois variables\",\"desc\":\"Indiquez votre clé, l'URL de l'endpoint et l'id du modèle. Sous Windows, utilisez setx et rouvrez le terminal.\"},\"run\":{\"title\":\"Commencez à coder\",\"desc\":\"Lancez-le dans le dossier de votre projet pour commencer à travailler avec le modèle.\"}}}}},\"compare\":{\"title\":\"Côte à côte\",\"needTwoTitle\":\"Sélectionnez au moins 2 modèles\",\"needTwoDesc\":\"Revenez à la liste et cochez des modèles à comparer, ou recherchez-les pour les ajouter.\",\"goPick\":\"← Choisir des modèles\",\"modelsN\":\"{n} modèles\",\"diffOnly\":\"Différences seules\",\"copyLink\":\"Copier le lien\",\"linkCopied\":\"Lien copié\",\"copyFailed\":\"Échec de la copie\",\"usageTitle\":\"Estimé par usage (200M ent / 50M sort / 60% succès cache)\",\"channel\":\"Canal\",\"officialList\":\"Officiel / liste\",\"minChannel\":\"Canal le moins cher\",\"sameRank\":\"Les canaux officiel et le moins cher ont le même classement.\",\"diffRank\":\"⚠ Le canal officiel et le canal le moins cher ne donnent pas le même classement. En regardant uniquement le tarif officiel, on aboutit à la conclusion inverse.\",\"remove\":\"Retirer ✕\",\"dims\":{\"officialInput\":\"Entrée officielle / liste\",\"officialOutput\":\"Sortie officielle / liste\",\"blended31\":\"Mixte 3:1\",\"cacheRead\":\"Lecture cache\",\"minInput\":\"Entrée canal le moins cher\",\"minOutput\":\"Sortie canal le moins cher\",\"minSource\":\"Source du canal le moins cher\",\"spread\":\"Écart entre plateformes\",\"context\":\"Fenêtre de contexte\",\"outputLimit\":\"Limite de sortie\",\"reasoning\":\"Raisonnement\",\"toolCall\":\"Appel d'outils\",\"structured\":\"Sortie structurée\",\"inputModalities\":\"Modalités d'entrée\",\"openWeights\":\"Poids ouverts\",\"knowledge\":\"Date de connaissance\",\"releaseDate\":\"Date de sortie\",\"hostCount\":\"Nb de fournisseurs\",\"benchmarkCount\":\"Benchmarks\"}},\"costTool\":{\"title\":\"Calculateur de coûts\",\"subtitle\":\"Saisissez l’usage mensuel et choisissez les modèles à chiffrer. Chacun est calculé deux fois, sur son canal officiel et sur son canal payant le moins cher. Le taux de cache est une entrée distincte car l’entrée mise en cache est facturée très en dessous du prix d’entrée normal.\",\"inputTokens\":\"Tokens d'entrée / mois\",\"outputTokens\":\"Tokens de sortie / mois\",\"cacheHit\":\"Taux de succès du cache {n}%\",\"scenarios\":\"Préréglages de scénario\",\"preset\":{\"light\":{\"name\":\"Essai léger\",\"assume\":\"2M ent / 0,5M sort · 0% cache\"},\"agent\":{\"name\":\"Codage agent\",\"assume\":\"200M ent / 50M sort · 60% cache\"},\"batch\":{\"name\":\"Gros lot\",\"assume\":\"1B ent / 100M sort · 80% cache\"}},\"pickModels\":\"Modèles\",\"empty\":\"Recherche et ajoute des modèles ci-dessus pour estimer ton coût mensuel.\",\"th\":{\"model\":\"Modèle\",\"official\":\"Officiel / liste\",\"cheapest\":\"Canal le moins cher\"},\"note\":\"Coût mensuel = entrée×(1−cache)×prix + entrée×cache×lecture-de-cache + sortie×prix. Les canaux sans prix de lecture de cache sont facturés au prix d’entrée. Les canaux à 0 $ sont exclus, car les paliers gratuits ont généralement des limites de débit et aucun SLA. Les passerelles peuvent comporter des limites cachées : vérifiez vous-même la disponibilité.\"},\"tokenTool\":{\"title\":\"Compteur de tokens · multi-tokeniseur\",\"subtitle\":\"Collez un texte pour voir son nombre de tokens et son coût selon chaque tokenizer. Les décomptes de la famille OpenAI sont calculés exactement dans le navigateur ; les autres sont signalés comme estimations avec une marge. L’écart est le plus marqué en chinois et dans les autres textes CJK, où o200k utilise nettement moins de tokens que cl100k pour les mêmes caractères.\",\"placeholder\":\"Colle ou saisis du texte ici…\",\"charCount\":\"{n} caractères\",\"cjkRatio\":\"{pct}% CJK\",\"loadSample\":\"Charger un exemple bilingue\",\"clear\":\"Effacer\",\"compareTitle\":\"Tokens selon les tokeniseurs\",\"exact\":\"Exact\",\"estimate\":\"Estimation ±{pct}%\",\"estShort\":\"est.\",\"compareNote\":\"Les décomptes exacts utilisent gpt-tokenizer (o200k_base / cl100k_base). Les estimations s’appuient sur le décompte exact o200k et sont mises à l’échelle selon la proportion de CJK : considérez-les comme des ordres de grandeur et non comme des valeurs précises. Claude et Gemini n’ont pas de tokenizer public côté client.\",\"costTitle\":\"Coût de ce texte, par modèle\",\"costNote\":\"Coût = tokens ÷ 1M × le prix catalogue du modèle. « En entrée » utilise le prix d'entrée, « en sortie » le prix de sortie. Les décomptes de tokens des modèles non-OpenAI sont des estimations.\",\"families\":{\"gpt4o\":\"GPT-4o / GPT-5 (o200k)\",\"gpt4\":\"GPT-4 / GPT-3.5 (cl100k)\",\"claude\":\"Claude\",\"gemini\":\"Gemini\",\"llama\":\"Llama 3\"},\"th\":{\"tokenizer\":\"Tokeniseur\",\"tokens\":\"Tokens\",\"cpt\":\"Caractères / token\",\"accuracy\":\"Précision\",\"model\":\"Modèle\",\"asInput\":\"En entrée\",\"asOutput\":\"En sortie\"},\"sampleText\":\"The quick brown fox jumps over the lazy dog. 敏捷的棕色狐狸跳过了那只懒狗。人工智能正在改变我们编写和部署软件的方式。\"},\"subTool\":{\"title\":\"Abonnement vs API\",\"subtitle\":\"Comparez un abonnement IA à l’API à l’usage pour votre niveau de consommation. Les abonnements sont facturés par fenêtre de temps et non au token, il n’existe donc pas de seuil de rentabilité exact : les résultats sont donnés sous forme de fourchettes, avec la sensibilité au cache et la date de vérification de chaque offre.\",\"disclaimer\":\"Les prix et quotas des offres sont maintenus à la main et n’ont pas été vérifiés auprès de chaque fournisseur individuellement. Les prix d’API sont lus dans le catalogue : changer la base de prix peut inverser la conclusion. Les règles de quota changent fréquemment ; la page officielle prévaut.\",\"promptsPerDay\":\"Prompts / jour\",\"avgIn\":\"Tokens d’entrée / appel\",\"avgOut\":\"Tokens de sortie / appel\",\"cacheHit\":\"Taux de cache {n}%\",\"callsPerPrompt\":\"Appels au modèle par prompt : {n}\",\"callsPerPromptHint\":\"En chat, environ 1. Un agent planifie, cherche, appelle des outils et résume : un prompt déclenche souvent de 5 à 30 appels. C’est ainsi qu’un modèle peu coûteux au token peut rester cher à la tâche.\",\"basis\":\"Base de prix API\",\"basisOfficial\":\"Officiel\",\"basisCheapest\":\"Le moins cher payant\",\"basisOfficialNote\":\"Tarif public du fournisseur d’origine, l’alternative comparable à un abonnement d’origine.\",\"basisCheapestNote\":\"Canal payant le moins cher, tous hôtes confondus. Souvent une passerelle tierce : jugez vous-même la fiabilité.\",\"scenarios\":\"Scénarios prédéfinis\",\"preset\":{\"chat\":{\"name\":\"Chat léger\",\"assume\":\"30 prompts/j · 3K ent. / 0,7K sort. · 20% cache · 1 appel\"},\"agent\":{\"name\":\"Agent de code\",\"assume\":\"20 prompts/j · 15K ent. / 3K sort. · 70% cache · 8 appels\"},\"heavy\":{\"name\":\"Agent intensif\",\"assume\":\"60 prompts/j · 25K ent. / 5K sort. · 80% cache · 12 appels\"}},\"monthlyCalls\":\"≈ {n} appels au modèle / mois à ce rythme.\",\"coverage\":{\"within\":\"Dans le quota\",\"near\":\"Proche de la limite\",\"over\":\"Quota dépassé\"},\"status\":{\"limited\":\"Vente limitée\",\"discontinued\":\"Arrêté\"},\"perMonth\":\"/mois\",\"pricedAgainst\":\"Calculé avec\",\"modelDetail\":\"détails →\",\"aaTitle\":\"Indice d’intelligence Artificial Analysis\",\"myApiCost\":\"Votre usage via l’API :\",\"verdictSaves\":\"L’abonnement économise {lo}–{hi}/mois\",\"verdictPricier\":\"L’abonnement coûte {lo}–{hi} de plus par mois\",\"verdictEven\":\"À peu près équivalent à l’API\",\"verdictOverQuota\":\"Votre usage dépasse ce quota, le chiffre d’économie ne s’applique donc pas\",\"noPriceOnBasis\":\"Aucun prix public pour ce modèle sur cette base\",\"bestFit\":\"MEILLEUR CHOIX\",\"surplusTag\":\"QUOTA EXCÉDENTAIRE\",\"surplusShow\":\"Afficher {n} paliers supérieurs à quota excédentaire\",\"surplusHide\":\"Masquer les paliers supérieurs à quota excédentaire\",\"breakEven\":\"Seuil ≈ {range} prompts/jour\",\"sensitivity\":\"à 50% de cache ≈ {n}/jour\",\"spreadNote\":\"écart de prix {n}× entre hôtes\",\"checkedAt\":\"vérifié le {date}\",\"accountToggle\":\"Ce que vaut ce quota →\",\"acct\":{\"capacityMax\":\"Capacité mensuelle, borne supérieure (fenêtre connue la plus stricte : {hours} h)\",\"partialCaps\":\"Le quota officiel comporte d’autres plafonds sans chiffres publiés : cette capacité comme la remise ci-dessus sont donc surestimées.\",\"perCall\":\"Par appel au modèle\",\"quotaRaw\":\"Quota officiel\",\"capacity\":\"Capacité mensuelle (fenêtre la plus stricte : {hours} h)\",\"capacityValue\":\"{calls} appels · {prompts} prompts\",\"quotaWorth\":\"Même volume au prix API {basis}\",\"planPrice\":\"Prix de l’offre\",\"verdictDiscount\":\"Le quota coûte environ {pct}% de moins que le même volume acheté via l’API.\",\"verdictPremium\":\"Le quota coûte environ {pct}% de plus que le même volume acheté via l’API.\",\"caveat\":\"Basé sur {model} et le profil à gauche. L’écriture de cache n’est pas comptée, le coût API réel est donc légèrement supérieur.\"},\"notComputable\":\"Offres sans quota calculable\",\"notComputableDesc\":\"Elles ne publient aucun quota absolu, ou facturent dans une unité impossible à traduire en appels au modèle. Elles sont listées ici plutôt que dotées d’un chiffre inventé.\",\"rangeNote\":\"Les fourchettes de coût viennent de l’incertitude sur le cache (±15 pts). Les fourchettes de capacité viennent d’une lecture prudente ou optimiste de chaque quota de fenêtre. Le seuil de rentabilité est une zone, pas un point, car les quotas d’abonnement sont des fenêtres de temps non réductibles à un nombre fixe de tokens.\",\"windowNote\":\"Les fenêtres glissantes de moins d’un jour sont normalisées sur une hypothèse de {hours} heures actives par mois (8 h × 22 jours) ; les plafonds journaliers, hebdomadaires et mensuels sont des fenêtres calendaires et ne sont pas réduits.\"},\"subsCatalog\":{\"quota\":\"Quota :\",\"title\":\"Prix des abonnements IA\",\"subtitle\":\"Prix et quotas des offres ChatGPT, Claude, Gemini et autres abonnements IA grand public. Ils sont facturés par utilisateur et par mois, un axe distinct de la tarification au token des API. Au sein de chaque fournisseur, les offres sont classées par prix.\",\"disclaimer\":\"Les prix et limites sont des informations publiques collectées le {date} et non vérifiées auprès de chaque fournisseur individuellement. Les offres changent souvent ; la page officielle prévaut. Pour comparer un abonnement à l’API à l’usage, utilisez le\",\"calcLink\":\"Calculateur abonnement vs API →\",\"category\":\"Type\",\"catAll\":\"Tous\",\"catAssistant\":\"Assistant\",\"catCoding\":\"Codage\",\"audience\":\"Pour\",\"audAll\":\"Tous\",\"audIndividual\":\"Individuel\",\"audTeam\":\"Équipe\",\"free\":\"Gratuit\",\"perSeat\":\"/siège/mois\",\"perMonth\":\"/mois\",\"annual\":\"{price}/mois facturé annuellement\",\"official\":\"Officiel ↗\",\"footnote\":\"Des paliers entreprise et à prix personnalisé existent chez la plupart des fournisseurs et ne sont pas listés ici. Les abonnements grand public regroupent l'expérience app/éditeur et sont facturés par fenêtre de temps, ils ne se réduisent donc pas à un prix par token.\"},\"apiDocs\":{\"title\":\"API · MCP\",\"intro\":\"Les données normalisées de prix, de capacités et de classements qui alimentent ce site sont publiées en JSON statique, librement téléchargeables et sans clé d’API. Vous pouvez y brancher directement votre code ou un agent.\",\"endpoints\":\"Points de terminaison\",\"ep\":{\"models\":\"Tous les modèles : entrée canonique, prix officiel + canal le moins cher, prix mixtes, contexte, capacités, scores Artificial Analysis et usage sur 30 jours.\",\"providers\":\"Tous les fournisseurs : nom, palier (première partie / cloud / passerelle), nombre de modèles, SDK, base API et docs.\",\"llms\":\"Résumé du site en texte brut pour les crawlers IA (convention llms.txt).\"},\"static\":\"Servi comme fichiers statiques depuis un CDN, sans limite de débit. Merci malgré tout de mettre les réponses en cache plutôt que de les redemander à chaque requête. Les données sont rafraîchies à chaque build.\",\"fields\":\"Champs clés (models.json)\",\"field\":{\"identity\":\"Id canonique, nom d'affichage, labo et type de modèle.\",\"price\":\"Référence (officiel/liste) et canal payant le moins cher, chacun avec entrée/sortie/lecture-cache par 1M de tokens.\",\"blended\":\"Prix unitaire mixte (entrée×0,75 + sortie×0,25) pour les canaux de référence, le moins cher et le moins cher de confiance (passerelles exclues).\",\"spec\":\"Fenêtre de contexte, sortie max et indicateurs de capacité à trois états (true/false/null).\",\"aa\":\"Indices Artificial Analysis d'intelligence, codage, agentique, vitesse de sortie et coût par tâche (null si non couvert).\",\"usage\":\"Rang d'usage OpenRouter sur 30 jours, total de tokens et part (null si non suivi).\",\"hosts\":\"Combien de fournisseurs hébergent le modèle et l'écart de prix entre plateformes.\"},\"examples\":\"Exemples\",\"curl\":\"Les cinq modèles les moins chers au prix mixte, avec curl et jq :\",\"js\":\"JavaScript (fetch) :\",\"py\":\"Python (requests) :\",\"cors\":\"Les points de terminaison envoient Access-Control-Allow-Origin: *, ils fonctionnent donc aussi depuis le navigateur.\",\"mcp\":\"Serveur MCP\",\"mcpIntro\":\"Comme les données sont du JSON propre via HTTPS, tout serveur MCP capable de fetch peut les exposer à un agent. Par exemple, le serveur fetch de référence :\",\"mcpHow\":\"Demandez ensuite à l’agent de lire {url} et de raisonner dessus : le modèle le moins cher dans un budget donné, la meilleure intelligence par dollar, quels fournisseurs hébergent un modèle.\",\"mcpRoadmap\":\"Un serveur MCP première partie avec des outils typés (search_models, cheapest, compare) est sur la feuille de route. D'ici là, les points de terminaison JSON ci-dessus sont l'interface stable.\",\"license\":\"Licence \u0026 attribution\",\"licenseBody\":\"Les données sont agrégées depuis models.dev (MIT), Artificial Analysis et OpenRouter. Vous pouvez les réutiliser sous CC BY 4.0, en conservant l’attribution à LLM Pricing et aux sources en amont.\"},\"seo\":{\"releases\":{\"title\":\"Sorties de modèles d'IA — quoi et quand | LLM Pricing\",\"description\":\"Une chronologie des sorties de modèles d'IA, de la plus récente à la plus ancienne. Chaque entrée renvoie au prix et aux capacités du modèle chez tous les fournisseurs.\"},\"leaderboards\":{\"title\":\"Classements LLM — intelligence, codage, rapport qualité-prix \u0026 vitesse | LLM Pricing\",\"description\":\"Classez les LLM par intelligence, codage, capacité agentique, rapport qualité-prix, coût par tâche, vitesse et usage réel (Artificial Analysis).\"},\"frontier\":{\"title\":\"Frontière de valeur LLM — meilleure intelligence par dollar | LLM Pricing\",\"description\":\"La frontière de Pareto intelligence vs prix des LLM : tous les modèles à considérer, sans en oublier de moins chers-et-plus-forts.\"},\"tools\":{\"title\":\"Outils LLM — calculateur de coûts, tokeniseur \u0026 comparaison | LLM Pricing\",\"description\":\"Calculateurs et comparaisons sur les prix et classements des LLM : comparer, estimer le coût mensuel, compter les tokens, abonnement ou API.\"},\"cost\":{\"title\":\"Calculateur de coûts LLM | LLM Pricing\",\"description\":\"Estime le coût mensuel des API LLM entre fournisseurs à partir de ton usage de tokens et de ton taux de succès du cache.\"},\"token\":{\"title\":\"Compteur de tokens — multi-tokeniseur | LLM Pricing\",\"description\":\"Nombre de tokens et coût d’un même texte selon différents tokenizers de modèles.\"},\"subscription\":{\"title\":\"Calculateur abonnement vs API | LLM Pricing\",\"description\":\"Comparez le coût d’un abonnement IA à celui de l’API à l’usage pour votre niveau de consommation.\"},\"providers\":{\"title\":\"Fournisseurs LLM — première partie, cloud \u0026 passerelles | LLM Pricing\",\"description\":\"Chaque fournisseur hébergeant des LLM : SDK, points de terminaison API, docs, nombre de modèles et comparaison de leurs paliers de prix.\"},\"compare\":{\"title\":\"Comparer les LLM côte à côte | LLM Pricing\",\"description\":\"Mets 2–4 grands modèles de langage côte à côte : prix, contexte, capacités et coût du canal officiel vs le moins cher.\"},\"subscriptions\":{\"title\":\"Prix des abonnements IA — ChatGPT, Claude, Gemini | LLM Pricing\",\"description\":\"Forfaits et quotas d'abonnement IA grand public comparés : ChatGPT, Claude, Gemini et plus.\"},\"api\":{\"title\":\"API de prix LLM \u0026 MCP | LLM Pricing\",\"description\":\"Accède aux données de prix et de classement via une API REST et un serveur MCP pour que les agents les interrogent directement.\"},\"tutorials\":{\"title\":\"Guides de configuration CLI IA — Claude Code, Codex, Gemini CLI | LLM Pricing\",\"description\":\"Guides accessibles pour configurer les clés API et les points de terminaison personnalisés de Claude Code, Codex CLI, Gemini CLI, Aider, opencode et Qwen Code.\"},\"privacy\":{\"title\":\"Privacy Policy | LLM Pricing\",\"description\":\"How LLM Pricing handles cookies, advertising (Google AdSense) and analytics, and the choices you have.\"},\"about\":{\"title\":\"About LLM Pricing — independent LLM price \u0026 quality comparison\",\"description\":\"What LLM Pricing is, where its data comes from (models.dev, Artificial Analysis, OpenRouter) and how the numbers are put together.\"},\"contact\":{\"title\":\"Contact | LLM Pricing\",\"description\":\"Get in touch with LLM Pricing for questions, feedback or data corrections.\"},\"notFound\":{\"title\":\"Page not found (404) | LLM Pricing\",\"description\":\"This address doesn't match any page on LLM Pricing. Search models and providers, or head back to the pricing table.\"}},\"privacy\":{\"title\":\"Privacy Policy\",\"updated\":\"Last updated: 13 August 2026\",\"intro\":\"LLM Pricing (\\\"we\\\", \\\"us\\\") operates the website at llmpricing.dev. This page explains what information is processed when you visit and how it is used. LLM Pricing is a free, static informational site: there are no user accounts, and you don't need to sign in or submit any personal details to use it.\",\"collectTitle\":\"Information we collect\",\"collectBody\":\"We do not ask for or store personal information such as your name, email address or payment details, and there is no server-side database of visitors. Preferences you set, like light or dark theme and language, are stored locally in your own browser and are never sent to us.\",\"cookiesTitle\":\"Cookies and advertising\",\"cookiesBody\":\"This site uses Google AdSense to display advertising. Third-party vendors, including Google, use cookies to serve ads based on your prior visits to this and other websites.\",\"cookiesGoogle\":\"Google's use of advertising cookies enables it and its partners to serve ads to you based on your visits to this site and/or other sites on the internet. You can decline personalised advertising at any time.\",\"cookiesOptOut\":\"To opt out of personalised advertising, visit\",\"and\":\"and\",\"googleAdsSettings\":\"Google Ads Settings\",\"consentTitle\":\"Consent (EEA, UK \u0026 Switzerland)\",\"consentBody\":\"If you visit from the European Economic Area, the United Kingdom or Switzerland, we ask for your consent before any non-essential or advertising cookies are set.\",\"consentBody2\":\"We use a Google-certified Consent Management Platform (CMP) to show a message where you can agree, decline, or manage your choices in detail. If you decline, you may still see non-personalised ads, and you can reopen the consent tool at any time to review or change your selection.\",\"analyticsTitle\":\"Analytics\",\"analyticsBody\":\"We use Google Analytics to understand aggregate traffic, such as page views and rough geography. This data is processed by Google to help us improve the site and is not used to identify individual visitors.\",\"sharingTitle\":\"Data sharing\",\"sharingBody\":\"We do not sell your personal data. Information processed by the third-party services above is governed by their own privacy policies, including the\",\"googlePolicy\":\"Google Privacy Policy\",\"linksTitle\":\"External links\",\"linksBody\":\"Pages here link to provider and data-source websites. We are not responsible for the content or privacy practices of those external sites.\",\"childrenTitle\":\"Children\",\"childrenBody\":\"This site is intended for a general, professional audience and is not directed at children under 13.\",\"choicesTitle\":\"Your choices\",\"choicesBody\":\"You can disable or delete cookies in your browser settings and opt out of personalised ads using the links above. Blocking cookies will not prevent you from using the site.\",\"changesTitle\":\"Changes to this policy\",\"changesBody\":\"We may update this policy from time to time. Any material change will be reflected by the \\\"last updated\\\" date at the top of this page.\",\"contactTitle\":\"Contact\",\"contactBody\":\"Questions about this policy? Reach us via the\",\"contactLink\":\"contact page\"},\"about\":{\"title\":\"About LLM Pricing\",\"intro\":\"LLM Pricing is a free, independent tool for comparing the price, capabilities and quality of large language models across every provider that hosts them. The goal is simple: help developers and teams pick the right model at the right price without digging through a dozen separate pricing pages.\",\"whatTitle\":\"What you can do here\",\"whatBody\":\"Compare per-token input, output and cache pricing across providers; see the same model priced across every host to find the lowest channel; rank models by intelligence, coding ability, value and speed; and estimate real monthly cost with the built-in calculators.\",\"dataTitle\":\"Where the data comes from\",\"dataBody\":\"Pricing and capability data is aggregated from models.dev (MIT). Quality and speed benchmarks come from Artificial Analysis, and real-world usage popularity is drawn from OpenRouter. We merge the same model across hosts, compute a blended price and normalise capabilities so the figures are comparable.\",\"independenceTitle\":\"Independence\",\"independenceBody\":\"We are not affiliated with, sponsored by or endorsed by any of the model providers listed. Prices and specifications change often and are shown for reference only: always confirm on each provider's official page before relying on them.\",\"contactTitle\":\"Get in touch\",\"contactBody\":\"Found something wrong or have a suggestion? Reach us via the\",\"contactLink\":\"contact page\"},\"contact\":{\"title\":\"Contact\",\"intro\":\"Questions, corrections or feedback about the data? We'd like to hear from you.\",\"emailTitle\":\"Email\",\"emailBody\":\"Reach us at\",\"socialTitle\":\"Social\",\"socialBody\":\"Find us on X (Twitter) at\",\"dataTitle\":\"Data corrections\",\"dataBody\":\"Spotted a wrong price or a missing model? Pricing is aggregated from models.dev, and corrections there flow back here. For anything else, email us at the address above.\"},\"faq\":{\"q1\":\"Quelle est l'API LLM la moins chère en {year} ?\",\"a1\":\"D'après notre comparaison de {modelCount}+ modèles, {cheapestModel} de {cheapestProvider} offre le prix mixte le plus bas, à environ {cheapestPrice} $ par 1M de tokens.\",\"q2\":\"Comment estimer les coûts d'une API LLM ?\",\"a2\":\"Multiplie tes tokens d'entrée par le prix d'entrée du modèle par 1M de tokens, fais de même pour les tokens de sortie, puis additionne. Utilise le calculateur de coûts intégré pour estimer les totaux de n'importe quel modèle et fournisseur.\",\"q3\":\"Quel LLM a la plus grande fenêtre de contexte ?\",\"a3\":\"{largestModel} de {largestProvider} prend en charge la plus grande fenêtre de contexte, jusqu'à {largestContext} tokens.\",\"q4\":\"Quels fournisseurs et modèles sont comparés ici ?\",\"a4\":\"Ce site compare {modelCount}+ modèles chez des fournisseurs comme {providers}, avec les prix d'entrée, de sortie et de cache par 1M de tokens ainsi que des classements de qualité.\"},\"toast\":{\"maxCompare\":\"Comparez jusqu'à {n} modèles\"},\"modelActions\":{\"copyId\":\"Copier l'ID\",\"copied\":\"{id} copié\",\"copyFailed\":\"Échec de la copie, sélectionnez manuellement\",\"addCompare\":\"+ Ajouter au comparatif\",\"added\":\"✓ Dans le comparatif\"},\"modelDetail\":{\"subN\":\" · {n} via abonnement\",\"backList\":\"← Liste des modèles\",\"notFoundTitle\":\"Modèle introuvable\",\"backHome\":\"← Retour à la liste\",\"glance\":\"En un coup d'œil\",\"officialPrice\":\"Prix officiel\",\"refPrice\":\"Prix de référence\",\"cacheRead\":\"Lecture de cache\",\"priceUndisclosed\":\"Prix non communiqué\",\"lowestPaid\"
