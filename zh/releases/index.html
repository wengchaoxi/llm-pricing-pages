ort\":\"估\",\"compareNote\":\"精确值用 gpt-tokenizer（o200k_base / cl100k_base）。估算以精确的 o200k 数为锚、按 CJK 占比缩放，只作量级参考而非精确值。Claude、Gemini 没有公开的客户端分词器。\",\"costTitle\":\"这段文本按模型算钱\",\"costNote\":\"成本 = tokens ÷ 100 万 × 该模型牌价。「作为输入」用输入价，「作为输出」用输出价。非 OpenAI 模型的 token 数为估算。\",\"families\":{\"gpt4o\":\"GPT-4o / GPT-5（o200k）\",\"gpt4\":\"GPT-4 / GPT-3.5（cl100k）\",\"claude\":\"Claude\",\"gemini\":\"Gemini\",\"llama\":\"Llama 3\"},\"th\":{\"tokenizer\":\"分词器\",\"tokens\":\"Token 数\",\"cpt\":\"字符 / token\",\"accuracy\":\"精度\",\"model\":\"模型\",\"asInput\":\"作为输入\",\"asOutput\":\"作为输出\"},\"sampleText\":\"The quick brown fox jumps over the lazy dog. 敏捷的棕色狐狸跳过了那只懒狗。人工智能正在改变我们编写和部署软件的方式。\"},\"subTool\":{\"title\":\"订阅 vs 按量\",\"subtitle\":\"按你的用量权衡 AI 订阅与按量付费 API。订阅按时间窗口计费而非按 token，因此不存在精确的盈亏平衡点：结果以区间给出，并附缓存敏感度与每个套餐的核对日期。\",\"disclaimer\":\"套餐价格与额度为人工维护，未逐家向官方核实。API 牌价取自目录，因此更换价格基准可能使结论反转。额度规则变动频繁，以官方页面为准。\",\"promptsPerDay\":\"每天发起的 prompt 数\",\"avgIn\":\"单次模型调用输入 token\",\"avgOut\":\"单次模型调用输出 token\",\"cacheHit\":\"缓存命中率 {n}%\",\"callsPerPrompt\":\"每个 prompt 触发的模型调用数：{n}\",\"callsPerPromptHint\":\"对话约为 1。Agent 要规划、检索、调工具、执行、总结，一个 prompt 常触发 5–30 次调用。这就是每 token 单价低的模型、每个任务仍可能很贵的原因。\",\"basis\":\"API 价格基准\",\"basisOfficial\":\"官方牌价\",\"basisCheapest\":\"最低付费渠道\",\"basisOfficialNote\":\"第一方牌价，与第一方订阅属同类可比的替代方案。\",\"basisCheapestNote\":\"全网最低付费渠道。常来自第三方网关，可靠性需自行判断。\",\"scenarios\":\"场景预设\",\"preset\":{\"chat\":{\"name\":\"轻量对话\",\"assume\":\"30 prompt/天 · 3K 入 / 0.7K 出 · 20% 缓存 · 1 次调用\"},\"agent\":{\"name\":\"Agent 编码\",\"assume\":\"20 prompt/天 · 15K 入 / 3K 出 · 70% 缓存 · 8 次调用\"},\"heavy\":{\"name\":\"重度 Agent\",\"assume\":\"60 prompt/天 · 25K 入 / 5K 出 · 80% 缓存 · 12 次调用\"}},\"monthlyCalls\":\"这个用量下约 {n} 次模型调用 / 月。\",\"coverage\":{\"within\":\"额度够用\",\"near\":\"接近上限\",\"over\":\"超出额度\"},\"status\":{\"limited\":\"限售\",\"discontinued\":\"已停售\"},\"perMonth\":\"/月\",\"pricedAgainst\":\"按此模型计价\",\"modelDetail\":\"详情 →\",\"aaTitle\":\"Artificial Analysis 智能指数\",\"myApiCost\":\"你的用量按 API 计：\",\"verdictSaves\":\"订阅每月省 {lo}–{hi}\",\"verdictPricier\":\"订阅每月贵 {lo}–{hi}\",\"verdictEven\":\"与按量差不多\",\"verdictOverQuota\":\"你的用量超出该套餐额度，省钱结论不适用\",\"noPriceOnBasis\":\"该基准下这个模型没有公开价\",\"bestFit\":\"最合适\",\"surplusTag\":\"额度富余\",\"surplusShow\":\"显示 {n} 个额度富余的更高档位\",\"surplusHide\":\"收起额度富余的更高档位\",\"breakEven\":\"盈亏平衡约 {range} prompt/天\",\"sensitivity\":\"缓存 50% 时约 {n}/天\",\"spreadNote\":\"跨宿主价差 {n}×\",\"checkedAt\":\"核对于 {date}\",\"accountToggle\":\"这份额度值多少钱 →\",\"acct\":{\"capacityMax\":\"月度容量上限（已知最紧窗口：{hours} 小时）\",\"partialCaps\":\"官方口径里还有未公开具体数字的额外上限，因此这里的容量和上面的折扣都是高估值。\",\"perCall\":\"单次模型调用\",\"quotaRaw\":\"官方额度原文\",\"capacity\":\"月度容量（最紧窗口：{hours} 小时）\",\"capacityValue\":\"{calls} 次调用 · {prompts} 个 prompt\",\"quotaWorth\":\"同等用量按{basis}计\",\"planPrice\":\"套餐月费\",\"verdictDiscount\":\"这份额度比按 API 买同等用量便宜约 {pct}%。\",\"verdictPremium\":\"这份额度比按 API 买同等用量贵约 {pct}%。\",\"caveat\":\"基于 {model} 与左侧画像计算。未计入缓存写入费用，实际 API 成本略高于此。\"},\"notComputable\":\"无法计算额度的套餐\",\"notComputableDesc\":\"这些套餐没有公布绝对额度，或计价单位无法折算成模型调用次数。这里如实列出，而不是给一个编造的数字。\",\"rangeNote\":\"成本区间来自缓存命中的不确定带（±15 个百分点）；容量区间来自对窗口额度的保守/乐观两种读法。盈亏平衡是一个区域而不是一个点，因为订阅额度按时间窗口计，折不成固定的 token 数。\",\"windowNote\":\"短于一天的滚动窗按每月 {hours} 个活跃小时（8 小时 × 22 天）折算；日/周/月额度属日历窗口，不打折。\"},\"subsCatalog\":{\"quota\":\"额度：\",\"title\":\"AI 订阅价格\",\"subtitle\":\"ChatGPT、Claude、Gemini 等消费级 AI 订阅的套餐价格与额度。它们按用户/月计费，与按 token 的 API 属于不同计价轴。每家服务商内按价格排列。\",\"disclaimer\":\"价格与额度为 {date} 采集的公开信息，未逐家向官方核实。套餐变动频繁，以官方页面为准。要在订阅与按量付费 API 之间取舍，请用\",\"calcLink\":\"订阅 vs API 计算器 →\",\"category\":\"类型\",\"catAll\":\"全部\",\"catAssistant\":\"助手\",\"catCoding\":\"编码\",\"audience\":\"对象\",\"audAll\":\"全部\",\"audIndividual\":\"个人\",\"audTeam\":\"团队\",\"free\":\"免费\",\"perSeat\":\"/席/月\",\"perMonth\":\"/月\",\"annual\":\"年付 {price}/月\",\"official\":\"官方 ↗\",\"footnote\":\"多数厂商还有企业版 / 定制价档位，此处未列。消费级订阅捆绑了应用/编辑器体验、按时间窗口计费，无法折算成每 token 单价。\"},\"apiDocs\":{\"title\":\"API · MCP 接口\",\"intro\":\"本站背后归一化的价格、能力与榜单数据以纯静态 JSON 开放，免费拉取、无需密钥。可以让你的代码或 agent 直接读取。\",\"endpoints\":\"端点\",\"ep\":{\"models\":\"全部模型：canonical 条目、官方 + 最低渠道价、综合单价、上下文、能力、Artificial Analysis 分数与 30 天用量。\",\"providers\":\"全部服务商：名称、分层（第一方 / 云平台 / 网关）、模型数、SDK、API base 与文档。\",\"llms\":\"面向 AI 抓取的纯文本站点摘要（llms.txt 约定）。\"},\"static\":\"以静态文件经 CDN 提供，没有速率限制。仍请缓存响应，不要每次请求都重新拉取。数据在每次构建时刷新。\",\"fields\":\"关键字段（models.json）\",\"field\":{\"identity\":\"Canonical id、展示名、实验室与模型类型。\",\"price\":\"参考（官方/牌价）与最低付费渠道，各含每 1M token 的输入/输出/缓存读价。\",\"blended\":\"综合单价（输入×0.75 + 输出×0.25），分参考、最低、最低可信（排除网关）三种渠道。\",\"spec\":\"上下文窗口、最大输出，以及三态能力位（true/false/null）。\",\"aa\":\"Artificial Analysis 智能、编码、Agent 指数、输出速度与每任务成本（无数据为 null）。\",\"usage\":\"OpenRouter 30 天用量排名、总 token 与占比（未追踪为 null）。\",\"hosts\":\"有多少家服务商托管该模型，以及跨平台价差。\"},\"examples\":\"示例\",\"curl\":\"用 curl + jq 取综合单价最低的 5 个模型：\",\"js\":\"JavaScript（fetch）：\",\"py\":\"Python（requests）：\",\"cors\":\"端点带 Access-Control-Allow-Origin: *，浏览器里也能直接跨域取用。\",\"mcp\":\"MCP server\",\"mcpIntro\":\"由于数据是 HTTPS 上的干净 JSON，任何具备 fetch 能力的 MCP server 都能把它暴露给 agent。例如官方参考的 fetch server：\",\"mcpHow\":\"然后让 agent 读取 {url} 并在其上推理：预算内最便宜的模型、每美元智能分最高的模型、某个模型有哪些服务商托管。\",\"mcpRoadmap\":\"带类型化工具（search_models、cheapest、compare）的第一方 MCP server 已排进路线图。在那之前，上面的 JSON 端点就是稳定接口。\",\"license\":\"许可与署名\",\"licenseBody\":\"数据归并自 models.dev（MIT）、Artificial Analysis 与 OpenRouter。可按 CC BY 4.0 复用，请保留对 LLM Pricing 与上游来源的署名。\"},\"seo\":{\"releases\":{\"title\":\"AI 模型发布 — 何时发布了什么 | LLM Pricing\",\"description\":\"AI 模型发布时间线，按上线时间由新到旧排列。每一条都链接到该模型在各家服务商的完整价格与能力。\"},\"leaderboards\":{\"title\":\"大模型榜单 — 智能 / 编码 / 性价比 / 速度 | LLM Pricing\",\"description\":\"按 Artificial Analysis 智能分、编码、Agent 能力、性价比、每任务成本、速度与真实用量给大语言模型排名。\"},\"frontier\":{\"title\":\"大模型性价比前沿 — 每美元最强智能 | LLM Pricing\",\"description\":\"大模型「智能 × 价格」的帕累托前沿：值得考虑的候选一网打尽，没有「更便宜且更强」被遗漏。\"},\"tools\":{\"title\":\"大模型工具 — 成本计算器 / 分词器 / 对比 | LLM Pricing\",\"description\":\"基于大模型价格与榜单数据的计算与对照工具：对比模型、估算月成本、计算 token、权衡订阅与 API。\"},\"cost\":{\"title\":\"大模型成本计算器 | LLM Pricing\",\"description\":\"根据你的 token 用量与缓存命中率，跨服务商估算大模型 API 的月成本。\"},\"token\":{\"title\":\"Token 计算器 — 跨分词器对比 | LLM Pricing\",\"description\":\"同一段文本在不同模型分词器下的 token 数与对应成本。\"},\"subscription\":{\"title\":\"订阅 vs API 计算器 | LLM Pricing\",\"description\":\"按你的用量权衡 AI 订阅与按量付费 API 的成本。\"},\"providers\":{\"title\":\"大模型服务商 — 第一方 / 云平台 / 网关 | LLM Pricing\",\"description\":\"所有托管大模型的服务商：SDK、API 端点、文档、模型数，以及各自定价分层对比。\"},\"compare\":{\"title\":\"大模型并排对比 | LLM Pricing\",\"description\":\"把 2–4 个大语言模型并排比较：价格、上下文、能力，以及官方 vs 最低渠道成本。\"},\"subscriptions\":{\"title\":\"AI 订阅价格 — ChatGPT / Claude / Gemini | LLM Pricing\",\"description\":\"消费级 AI 订阅套餐与额度对照：ChatGPT、Claude、Gemini 等。\"},\"api\":{\"title\":\"大模型价格 API 与 MCP | LLM Pricing\",\"description\":\"通过 REST API 与 MCP server 开放价格与榜单数据，让 agent 直接查询。\"},\"tutorials\":{\"title\":\"AI 命令行工具配置教程 — Claude Code、Codex、Gemini CLI | LLM Pricing\",\"description\":\"手把手教你为 Claude Code、Codex CLI、Gemini CLI、Aider、opencode、Qwen Code 配置 API 密钥与自定义端点，小白也能照着做。\"},\"privacy\":{\"title\":\"Privacy Policy | LLM Pricing\",\"description\":\"How LLM Pricing handles cookies, advertising (Google AdSense) and analytics, and the choices you have.\"},\"about\":{\"title\":\"About LLM Pricing — independent LLM price \u0026 quality comparison\",\"description\":\"What LLM Pricing is, where its data comes from (models.dev, Artificial Analysis, OpenRouter) and how the numbers are put together.\"},\"contact\":{\"title\":\"Contact | LLM Pricing\",\"description\":\"Get in touch with LLM Pricing for questions, feedback or data corrections.\"},\"notFound\":{\"title\":\"Page not found (404) | LLM Pricing\",\"description\":\"This address doesn't match any page on LLM Pricing. Search models and providers, or head back to the pricing table.\"}},\"privacy\":{\"title\":\"Privacy Policy\",\"updated\":\"Last updated: 13 August 2026\",\"intro\":\"LLM Pricing (\\\"we\\\", \\\"us\\\") operates the website at llmpricing.dev. This page explains what information is processed when you visit and how it is used. LLM Pricing is a free, static informational site: there are no user accounts, and you don't need to sign in or submit any personal details to use it.\",\"collectTitle\":\"Information we collect\",\"collectBody\":\"We do not ask for or store personal information such as your name, email address or payment details, and there is no server-side database of visitors. Preferences you set, like light or dark theme and language, are stored locally in your own browser and are never sent to us.\",\"cookiesTitle\":\"Cookies and advertising\",\"cookiesBody\":\"This site uses Google AdSense to display advertising. Third-party vendors, including Google, use cookies to serve ads based on your prior visits to this and other websites.\",\"cookiesGoogle\":\"Google's use of advertising cookies enables it and its partners to serve ads to you based on your visits to this site and/or other sites on the internet. You can decline personalised advertising at any time.\",\"cookiesOptOut\":\"To opt out of personalised advertising, visit\",\"and\":\"and\",\"googleAdsSettings\":\"Google Ads Settings\",\"consentTitle\":\"Consent (EEA, UK \u0026 Switzerland)\",\"consentBody\":\"If you visit from the European Economic Area, the United Kingdom or Switzerland, we ask for your consent before any non-essential or advertising cookies are set.\",\"consentBody2\":\"We use a Google-certified Consent Management Platform (CMP) to show a message where you can agree, decline, or manage your choices in detail. If you decline, you may still see non-personalised ads, and you can reopen the consent tool at any time to review or change your selection.\",\"analyticsTitle\":\"Analytics\",\"analyticsBody\":\"We use Google Analytics to understand aggregate traffic, such as page views and rough geography. This data is processed by Google to help us improve the site and is not used to identify individual visitors.\",\"sharingTitle\":\"Data sharing\",\"sharingBody\":\"We do not sell your personal data. Information processed by the third-party services above is governed by their own privacy policies, including the\",\"googlePolicy\":\"Google Privacy Policy\",\"linksTitle\":\"External links\",\"linksBody\":\"Pages here link to provider and data-source websites. We are not responsible for the content or privacy practices of those external sites.\",\"childrenTitle\":\"Children\",\"childrenBody\":\"This site is intended for a general, professional audience and is not directed at children under 13.\",\"choicesTitle\":\"Your choices\",\"choicesBody\":\"You can disable or delete cookies in your browser settings and opt out of personalised ads using the links above. Blocking cookies will not prevent you from using the site.\",\"changesTitle\":\"Changes to this policy\",\"changesBody\":\"We may update this policy from time to time. Any material change will be reflected by the \\\"last updated\\\" date at the top of this page.\",\"contactTitle\":\"Contact\",\"contactBody\":\"Questions about this policy? Reach us via the\",\"contactLink\":\"contact page\"},\"about\":{\"title\":\"About LLM Pricing\",\"intro\":\"LLM Pricing is a free, independent tool for comparing the price, capabilities and quality of large language models across every provider that hosts them. The goal is simple: help developers and teams pick the right model at the right price without digging through a dozen separate pricing pages.\",\"whatTitle\":\"What you can do here\",\"whatBody\":\"Compare per-token input, output and cache pricing across providers; see the same model priced across every host to find the lowest channel; rank models by intelligence, coding ability, value and speed; and estimate real monthly cost with the built-in calculators.\",\"dataTitle\":\"Where the data comes from\",\"dataBody\":\"Pricing and capability data is aggregated from models.dev (MIT). Quality and speed benchmarks come from Artificial Analysis, and real-world usage popularity is drawn from OpenRouter. We merge the same model across hosts, compute a blended price and normalise capabilities so the figures are comparable.\",\"independenceTitle\":\"Independence\",\"independenceBody\":\"We are not affiliated with, sponsored by or endorsed by any of the model providers listed. Prices and specifications change often and are shown for reference only: always confirm on each provider's official page before relying on them.\",\"contactTitle\":\"Get in touch\",\"contactBody\":\"Found something wrong or have a suggestion? Reach us via the\",\"contactLink\":\"contact page\"},\"contact\":{\"title\":\"Contact\",\"intro\":\"Questions, corrections or feedback about the data? We'd like to hear from you.\",\"emailTitle\":\"Email\",\"emailBody\":\"Reach us at\",\"socialTitle\":\"Social\",\"socialBody\":\"Find us on X (Twitter) at\",\"dataTitle\":\"Data corrections\",\"dataBody\":\"Spotted a wrong price or a missing model? Pricing is aggregated from models.dev, and corrections there flow back here. For anything else, email us at the address above.\"},\"faq\":{\"q1\":\"{year} 年最便宜的大语言模型 API 是哪个？\",\"a1\":\"根据我们对 {modelCount}+ 个模型的比较，来自 {cheapestProvider} 的 {cheapestModel} 综合单价最低，每百万 tokens 约 ${cheapestPrice}。\",\"q2\":\"如何估算大语言模型 API 的成本？\",\"a2\":\"将输入 tokens 数乘以模型每百万 tokens 的输入价格，输出 tokens 同理，然后相加。用内置成本计算器可快速估算任意模型/渠道的总成本。\",\"q3\":\"哪个大语言模型的上下文窗口最大？\",\"a3\":\"来自 {largestProvider} 的 {largestModel} 支持最大的上下文窗口，最高可达 {largestContext} tokens。\",\"q4\":\"这里比较了哪些服务商和模型？\",\"a4\":\"本站比较了 {modelCount}+ 个模型，覆盖 {providers} 等服务商，含每百万 tokens 的输入、输出与缓存价格，以及质量榜单。\"},\"toast\":{\"maxCompare\":\"最多对比 {n} 个模型\"},\"modelActions\":{\"copyId\":\"复制 ID\",\"copied\":\"已复制 {id}\",\"copyFailed\":\"复制失败，请手动选择\",\"addCompare\":\"+ 加入对比\",\"added\":\"✓ 已在对比\"},\"modelDetail\":{\"subN\":\" · {n} 家订阅覆盖\",\"backList\":\"← 模型列表\",\"notFoundTitle\":\"未找到该模型\",\"backHome\":\"← 返回列表\",\"glance\":\"一眼看懂\",\"officialPrice\":\"官方价\",\"refPrice\":\"参考价\",\"cacheRead\":\"缓存读取\",\"priceUndisclosed\":\"价格未公开\",\"lowestPaid\":\"最低付费价\",\"spread\":\"{n}× 价差\",\"noPaid\":\"暂无付费渠道\",\"moreFree\":\"另有 {n
